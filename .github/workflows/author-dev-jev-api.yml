name: author-dev-jev-api

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: author-dev-jev-api
  cancel-in-progress: false

jobs:
  author:
    if: github.repository == 'roccho-dev/envs' && github.ref_name == 'proposals'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: dev-authoring
    steps:
      - name: Checkout exact canonical revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install pinned Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes

      - name: Author ciphertext
        env:
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
          SOPS_AGE_RECIPIENTS: ${{ vars.SOPS_AGE_RECIPIENTS }}
        run: >-
          nix shell
          github:NixOS/nixpkgs/f9948418dc8628ac02b6d6337e191ade9429d59d#sops
          -c python3 adapters/jev_api.py author

      - name: Verify candidate tree
        run: python3 checks/repository.py

      - name: Open ciphertext-only authority PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="author/dev-jev-api-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: author dev Jev ciphertext"
          git push origin "HEAD:refs/heads/$branch"
          gh pr create \
            --base proposals \
            --head "$branch" \
            --title "chore: author dev Jev ciphertext" \
            --body "Generated by the manual dev-authoring boundary. Contains ciphertext and durable contract state only; no plaintext or private age identity."
