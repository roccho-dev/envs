name: author-dev-jev-api

on:
  workflow_dispatch:
    inputs:
      target:
        description: Declared authoring binding
        required: true
        type: choice
        options:
          - jev-api
          - jev-api.oci-dev

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: author-dev-jev-api
  cancel-in-progress: false

jobs:
  author:
    if: github.repository == 'roccho-dev/envs' && github.ref_name == 'proposals'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: dev-authoring
    steps:
      - name: Checkout exact canonical revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      # Consumes the artifact that check provided for this exact SHA; nothing is built or installed here.
      - name: Obtain provided effect artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ENVS_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "platform: $ImageOS $ImageVersion"
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions"
          auth="Authorization: Bearer $GH_TOKEN"
          art="$(mktemp -d)"
          curl -fsSL -H "$auth" -o "$art/list.json" "$api/artifacts?name=envs-effect-$ENVS_SOURCE_SHA&per_page=100"
          jq -e '[.artifacts[] | select(.expired | not)] | length == 1 and (.[0].digest | test("^sha256:[0-9a-f]{64}$"))' "$art/list.json" >/dev/null
          jq '[.artifacts[] | select(.expired | not)][0]' "$art/list.json" >"$art/artifact.json"
          id="$(jq -r '.id' "$art/artifact.json")"
          digest="$(jq -r '.digest' "$art/artifact.json")"
          run_id="$(jq -r '.workflow_run.id' "$art/artifact.json")"
          curl -fsSL -H "$auth" -o "$art/run.json" "$api/runs/$run_id"
          jq -e --arg sha "$ENVS_SOURCE_SHA" --arg branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" --arg repo "$GITHUB_REPOSITORY" --arg current "$GITHUB_RUN_ID" \
            '.path == ".github/workflows/check.yml" and .head_sha == $sha and .head_branch == $branch and .repository.full_name == $repo and .head_repository.full_name == $repo and ((.id | tostring) == $current or (.event == "push" and .conclusion == "success"))' \
            "$art/run.json" >/dev/null
          curl -fsSL -H "$auth" -o "$art/envs-effect.zip" "$api/artifacts/$id/zip"
          echo "${digest#sha256:}  $art/envs-effect.zip" | sha256sum -c -
          unzip -q "$art/envs-effect.zip" -d "$art/content"
          test "$(ls -A "$art/content")" = envs-effect.tar
          test "$(tar -xOf "$art/content/envs-effect.tar" SOURCE)" = "$ENVS_SOURCE_SHA"
          entry="$(tar -xOf "$art/content/envs-effect.tar" ENTRY)"
          [[ "$entry" =~ ^/nix/store/[0-9a-z]{32}-envs-effect-toolchain/bin/envs-effect$ ]]
          sudo mkdir -p /nix/store
          sudo tar -x -C / -f "$art/content/envs-effect.tar" nix/store
          test -x "$entry"
          echo "artifact: run=$run_id id=$id digest=$digest entry=$entry"
          echo "ENVS_EFFECT_BIN=${entry%/envs-effect}" >>"$GITHUB_ENV"
          echo "ENVS_EFFECT_DIGEST=$digest" >>"$GITHUB_ENV"
          echo "ENVS_EFFECT_ZIP=$art/envs-effect.zip" >>"$GITHUB_ENV"

      - name: Record effect toolchain identity
        run: '"$ENVS_EFFECT_BIN/envs-effect" --root "$GITHUB_WORKSPACE" toolchain'

      # One literal step per binding: each receives only its own inputs, and no target is substituted into a command.
      - name: Author ciphertext
        if: inputs.target == 'jev-api'
        env:
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
          SOPS_AGE_RECIPIENTS: ${{ vars.SOPS_AGE_RECIPIENTS }}
        run: '"$ENVS_EFFECT_BIN/envs-effect" --root "$GITHUB_WORKSPACE" author --target jev-api'

      - name: Author OCI dev ciphertext
        if: inputs.target == 'jev-api.oci-dev'
        env:
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
          OCI_DEV_AGE_RECIPIENT: ${{ vars.OCI_DEV_AGE_RECIPIENT }}
        run: '"$ENVS_EFFECT_BIN/envs-effect" --root "$GITHUB_WORKSPACE" author --target jev-api.oci-dev'

      - name: Verify candidate tree
        run: '"$ENVS_EFFECT_BIN/python3" -I checks/repository.py'

      - name: Open ciphertext-only authority PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tool="$ENVS_EFFECT_BIN"
          branch="author/dev-jev-api-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          "$tool/git" switch -c "$branch"
          "$tool/git" add -A
          "$tool/git" diff --cached --check
          "$tool/git" config user.name "github-actions[bot]"
          "$tool/git" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          "$tool/git" commit -m "chore: author dev Jev ciphertext"
          "$tool/git" push origin "HEAD:refs/heads/$branch"
          "$tool/gh" pr create \
            --base proposals \
            --head "$branch" \
            --title "chore: author dev Jev ciphertext" \
            --body "Generated by the manual dev-authoring boundary. Contains ciphertext and durable contract state only, with no plaintext or private age identity."
