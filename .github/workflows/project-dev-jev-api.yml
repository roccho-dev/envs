name: project-dev-jev-api

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: project-dev-jev-api
  cancel-in-progress: false

jobs:
  project:
    if: github.repository == 'roccho-dev/envs' && github.ref_name == 'proposals'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: dev-projection
    steps:
      - name: Checkout exact canonical revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install pinned Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes

      # Realized before any secret is injected; later steps run only store paths from this closure.
      - name: Realize repo-owned effect toolchain
        run: nix build .#effect-toolchain --no-update-lock-file --out-link "$RUNNER_TEMP/envs-effect"

      - name: Project and read back target-native auth
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          "$RUNNER_TEMP/envs-effect/bin/envs-effect" project
          --envs-sha "${GITHUB_SHA}"
          --run-id "${GITHUB_RUN_ID}"
          --run-attempt "${GITHUB_RUN_ATTEMPT}"

      - name: Verify candidate handoff
        run: '"$RUNNER_TEMP/envs-effect/bin/python3" -I checks/repository.py'

      - name: Open non-secret handoff PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/envs-effect/bin"
          branch="handoff/dev-jev-api-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          "$tool/git" switch -c "$branch"
          "$tool/git" add handoffs/dev-jev-api.json
          "$tool/git" diff --cached --check
          "$tool/git" config user.name "github-actions[bot]"
          "$tool/git" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          "$tool/git" commit -m "chore: record dev Jev projection handoff"
          "$tool/git" push origin "HEAD:refs/heads/$branch"
          "$tool/gh" pr create \
            --base proposals \
            --head "$branch" \
            --title "chore: record dev Jev projection handoff" \
            --body "Generated after provider effect and name-only readback. Contains no plaintext secret, private key, or secret-value hash."
