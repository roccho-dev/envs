name: snapshot-ci

on:
  push:
    branches: [main, proposals]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snapshot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safety-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact snapshot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Verify public snapshot safety and contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-public-snapshot.py
          python3 tests/test_projection_receipt.py
          python3 scripts/provider_readiness.py
          bash scripts/runtime-secret-projection.sh check
          bash tests/runtime-secret-projection-destructive.sh

  go-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify dependencies
        run: go mod verify
      - name: Test imported implementation
        run: go test ./... -count=1
      - name: Vet imported implementation
        run: go vet ./...
      - name: Build imported commands
        run: go build ./...
      - name: Prove deterministic appearance projection
        shell: bash
        run: |
          set -euo pipefail
          first="$RUNNER_TEMP/appearance-first"
          second="$RUNNER_TEMP/appearance-second"
          go run ./cmd/envctl-appearance -input appearance/desired.jsonl -output "$first"
          go run ./cmd/envctl-appearance -input appearance/desired.jsonl -output "$second"
          diff -ru "$first" "$second"

  nix-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes
      - name: Parse Nix sources
        run: |
          set -euo pipefail
          nix-instantiate --parse flake.nix >/dev/null
          nix-instantiate --parse bindings/duckdb/flake.nix >/dev/null
          nix-instantiate --parse lib/package-bindings.nix >/dev/null
          nix-instantiate --parse modules/ssot-github-refs.nix >/dev/null
      - name: Evaluate root flake contracts
        run: nix flake check -L --show-trace --no-write-lock-file
      - name: Prove real SOPS age authoring roundtrip
        shell: bash
        run: |
          set -euo pipefail
          nix shell \
            github:NixOS/nixpkgs/f9948418dc8628ac02b6d6337e191ade9429d59d#age \
            github:NixOS/nixpkgs/f9948418dc8628ac02b6d6337e191ade9429d59d#sops \
            github:NixOS/nixpkgs/f9948418dc8628ac02b6d6337e191ade9429d59d#jq \
            --command bash tests/sops-authoring-roundtrip.sh
