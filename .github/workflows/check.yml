name: check

on:
  pull_request:
    branches:
      - proposals
  push:
    branches:
      - proposals
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: check-${{ github.ref }}
  # Never cancel a proposals push run: it provides the artifact that SHA's effect dispatch consumes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repository:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check repository contract
        run: python3 checks/repository.py

      - name: Test repository oracle
        run: python3 checks/test_repository.py

      - name: Test Jev adapter
        run: python3 checks/test_jev_api.py

      - name: Test rent tunnel adapter
        run: python3 checks/test_rent_tunnel.py

      - name: Test access probe adapter
        run: python3 checks/test_rent_access_probe.py

      - name: Test state proof adapter
        run: python3 checks/test_rent_state_proof.py

      - name: Verify explicit main compatibility refresh
        if: github.ref_name == 'main'
        run: python3 checks/repository.py --verify-main-compatibility-refresh

  toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ENVS_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      # The artifact is built from, and named after, this exact commit (never a PR merge ref).
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Built source is the named commit
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ENVS_SOURCE_SHA"
          test -z "$(git status --porcelain)"
          echo "source commit=$ENVS_SOURCE_SHA tree=$(git rev-parse 'HEAD^{tree}')"

      - name: Install pinned Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes

      - name: Reconstruct repo-owned effect toolchain
        run: nix build .#effect-toolchain --no-update-lock-file --print-build-logs --out-link "$RUNNER_TEMP/envs-effect"

      - name: Nix regenerates the committed lock from flake.nix
        run: |
          set -euo pipefail
          relock="$RUNNER_TEMP/relock"
          mkdir "$relock"
          git archive HEAD -- . ':!flake.lock' | tar -x -C "$relock"
          nix flake lock "$relock"
          cmp flake.lock "$relock/flake.lock"

      - name: Execute exact effect entry
        run: '"$RUNNER_TEMP/envs-effect/bin/envs-effect" toolchain'

      - name: Execute closure tools without credentials
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/envs-effect/bin"
          "$tool/python3" --version
          "$tool/sops" --version
          "$tool/git" --version
          "$tool/gh" --version
          "$tool/wrangler" --version
          for command in put list; do
            help="$("$tool/wrangler" pages secret "$command" --help 2>&1)"
            printf '%s\n' "$help"
            grep -F -- '--project-name' <<<"$help" >/dev/null
          done
          "$tool/wrangler" pages secret put --help 2>&1 | grep -Ei 'pages secret put <key>' >/dev/null

      # The probe tools come from the built closure: the exact client version and its service-token flags, the provider
      # declaration and the persistent root initialized and validated with every network route closed, and a real
      # localhost sshd/ssh exchange.
      - name: Access probe tools from the closure without network or credentials
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/envs-effect/bin"
          "$tool/cloudflared" --version | tee "$RUNNER_TEMP/cloudflared.version"
          grep -qF "cloudflared version 2026.6.1 " "$RUNNER_TEMP/cloudflared.version"
          "$tool/cloudflared" access ssh --help >"$RUNNER_TEMP/access-ssh.help" 2>&1 || true
          grep -qF -- --service-token-id "$RUNNER_TEMP/access-ssh.help"
          grep -qF -- --service-token-secret "$RUNNER_TEMP/access-ssh.help"
          probe="$RUNNER_TEMP/probe-config"
          mkdir "$probe"
          cp providers/dev-rent-access-probe/main.tf "$probe/"
          HTTPS_PROXY=http://127.0.0.1:9 HTTP_PROXY=http://127.0.0.1:9 "$tool/tofu" -chdir="$probe" init -input=false -no-color
          "$tool/tofu" -chdir="$probe" validate -no-color
          # The persistent root is declaration only: initialized without its backend and validated, never planned.
          rent="$RUNNER_TEMP/rent-cloudflare"
          mkdir "$rent"
          cp providers/dev-rent-cloudflare/main.tf "$rent/"
          HTTPS_PROXY=http://127.0.0.1:9 HTTP_PROXY=http://127.0.0.1:9 "$tool/tofu" -chdir="$rent" init -backend=false -input=false -no-color
          "$tool/tofu" -chdir="$rent" validate -no-color
          "$tool/ssh" -V
          "$tool/python3" -I checks/test_rent_access_probe.py --real-ssh "$tool"

      # The state proof roots come from the same closure: both initialized and validated with every network route
      # closed (the backend root without a backend), the Wrangler raw-read and marker-write argv shapes, and the
      # self-test with real OpenTofu and the real closure curl against a loopback HTTP fixture.
      - name: State proof roots from the closure without network or credentials
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/envs-effect/bin"
          state="$RUNNER_TEMP/state-config"
          mkdir -p "$state/backend"
          cp providers/dev-rent-state-proof/main.tf "$state/"
          cp providers/dev-rent-state-proof/backend/main.tf "$state/backend/"
          HTTPS_PROXY=http://127.0.0.1:9 HTTP_PROXY=http://127.0.0.1:9 "$tool/tofu" -chdir="$state" init -input=false -no-color
          "$tool/tofu" -chdir="$state" validate -no-color
          HTTPS_PROXY=http://127.0.0.1:9 HTTP_PROXY=http://127.0.0.1:9 "$tool/tofu" -chdir="$state/backend" init -backend=false -input=false -no-color
          "$tool/tofu" -chdir="$state/backend" validate -no-color
          "$tool/tofu" version
          "$tool/wrangler" r2 object get --help >"$RUNNER_TEMP/r2-object-get.help" 2>&1 || true
          grep -qF -- --pipe "$RUNNER_TEMP/r2-object-get.help"
          grep -qF -- --remote "$RUNNER_TEMP/r2-object-get.help"
          "$tool/wrangler" r2 object put --help >"$RUNNER_TEMP/r2-object-put.help" 2>&1 || true
          grep -qF -- --pipe "$RUNNER_TEMP/r2-object-put.help"
          "$tool/curl" --version
          "$tool/python3" -I checks/test_rent_state_proof.py --real-tofu "$tool/tofu" --real-s3 "$tool/curl"

      - name: Test Jev adapter on the toolchain interpreter
        run: '"$RUNNER_TEMP/envs-effect/bin/python3" -I checks/test_jev_api.py'

      # The locked closure sops encrypts and decrypts for real; check-only age makes throwaway identities in a temp dir.
      - name: Real locked SOPS roundtrip for the rent tunnel token
        run: |
          set -euo pipefail
          nix build .#check-age --no-update-lock-file --out-link "$RUNNER_TEMP/check-age"
          tool="$RUNNER_TEMP/envs-effect/bin"
          "$tool/python3" -I checks/test_rent_tunnel.py --sops "$tool/sops" --age-keygen "$RUNNER_TEMP/check-age/bin/age-keygen"

      # The same locked sops and check-only age prove the OCI dev target's single-recipient Jev ciphertext.
      - name: Real locked SOPS roundtrip for the OCI dev Jev key
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/envs-effect/bin"
          "$tool/python3" -I checks/test_jev_api.py --sops "$tool/sops" --age-keygen "$RUNNER_TEMP/check-age/bin/age-keygen"

      - name: Missing or mismatched toolchain is RED
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/envs-effect/bin"
          if "$tool/python3" -I adapters/jev_api.py toolchain; then
            echo "ambient entry without the toolchain manifest was accepted" >&2
            exit 1
          fi
          copy="$RUNNER_TEMP/mismatched-lock"
          mkdir "$copy"
          "$tool/git" archive HEAD | tar -x -C "$copy"
          "$tool/python3" -I -c 'import json, sys; p = sys.argv[1]; v = json.load(open(p)); v["nodes"]["nixpkgs"]["locked"]["narHash"] = "sha256-" + "A" * 43 + "="; json.dump(v, open(p, "w"))' "$copy/flake.lock"
          if "$tool/envs-effect" --root "$copy" toolchain; then
            echo "toolchain differing from flake.lock was accepted" >&2
            exit 1
          fi

      - name: Build provided effect artifact
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/provide"
          nix build .#effect-artifact --no-update-lock-file --print-build-logs --out-link "$RUNNER_TEMP/provide/envs-effect.tar"
          test "$(tar -xOf "$RUNNER_TEMP/provide/envs-effect.tar" SOURCE)" = "$ENVS_SOURCE_SHA"
          sha256sum "$RUNNER_TEMP/provide/envs-effect.tar"

      # Positive control: the listing does contain the closure sops, so an age binary there would be found too.
      - name: Check-only age is outside the provided artifact
        run: |
          set -euo pipefail
          tar -tf "$RUNNER_TEMP/provide/envs-effect.tar" >"$RUNNER_TEMP/provided.list"
          sops="$(readlink -f "$RUNNER_TEMP/envs-effect/bin/sops")"
          sops="${sops#/}"
          age="$(readlink -f "$RUNNER_TEMP/check-age/bin/age-keygen")"
          age="${age#/}"
          grep -qxF "$sops" "$RUNNER_TEMP/provided.list"
          curl="$(readlink -f "$RUNNER_TEMP/envs-effect/bin/curl")"
          curl="${curl#/}"
          grep -qxF "$curl" "$RUNNER_TEMP/provided.list"
          if grep -qxF "$age" "$RUNNER_TEMP/provided.list"; then
            echo "check-only age is in the provided artifact" >&2
            exit 1
          fi
          echo "provided artifact: sops and curl present, age absent; $(stat -L -c %s "$RUNNER_TEMP/provide/envs-effect.tar") bytes"

      - name: Provide effect artifact
        id: provide
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: envs-effect-${{ env.ENVS_SOURCE_SHA }}
          path: ${{ runner.temp }}/provide/envs-effect.tar
          if-no-files-found: error
          compression-level: 1

      - name: Record provided artifact identity
        env:
          ARTIFACT_ID: ${{ steps.provide.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.provide.outputs.artifact-digest }}
          ARTIFACT_URL: ${{ steps.provide.outputs.artifact-url }}
        run: echo "provided artifact id=$ARTIFACT_ID digest=$ARTIFACT_DIGEST url=$ARTIFACT_URL"

  # Effect shape: provided artifact over a data checkout of the same commit, run as author/project run it before secrets.
  effect-shape:
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source commit as data root
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Obtain provided effect artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ENVS_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          echo "platform: $ImageOS $ImageVersion"
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions"
          auth="Authorization: Bearer $GH_TOKEN"
          art="$(mktemp -d)"
          curl -fsSL -H "$auth" -o "$art/list.json" "$api/artifacts?name=envs-effect-$ENVS_SOURCE_SHA&per_page=100"
          jq -e '[.artifacts[] | select(.expired | not)] | length == 1 and (.[0].digest | test("^sha256:[0-9a-f]{64}$"))' "$art/list.json" >/dev/null
          jq '[.artifacts[] | select(.expired | not)][0]' "$art/list.json" >"$art/artifact.json"
          id="$(jq -r '.id' "$art/artifact.json")"
          digest="$(jq -r '.digest' "$art/artifact.json")"
          run_id="$(jq -r '.workflow_run.id' "$art/artifact.json")"
          curl -fsSL -H "$auth" -o "$art/run.json" "$api/runs/$run_id"
          jq -e --arg sha "$ENVS_SOURCE_SHA" --arg branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" --arg repo "$GITHUB_REPOSITORY" --arg current "$GITHUB_RUN_ID" \
            '.path == ".github/workflows/check.yml" and .head_sha == $sha and .head_branch == $branch and .repository.full_name == $repo and .head_repository.full_name == $repo and ((.id | tostring) == $current or (.event == "push" and .conclusion == "success"))' \
            "$art/run.json" >/dev/null
          curl -fsSL -H "$auth" -o "$art/envs-effect.zip" "$api/artifacts/$id/zip"
          echo "${digest#sha256:}  $art/envs-effect.zip" | sha256sum -c -
          unzip -q "$art/envs-effect.zip" -d "$art/content"
          test "$(ls -A "$art/content")" = envs-effect.tar
          test "$(tar -xOf "$art/content/envs-effect.tar" SOURCE)" = "$ENVS_SOURCE_SHA"
          entry="$(tar -xOf "$art/content/envs-effect.tar" ENTRY)"
          [[ "$entry" =~ ^/nix/store/[0-9a-z]{32}-envs-effect-toolchain/bin/envs-effect$ ]]
          sudo mkdir -p /nix/store
          sudo tar -x -C / -f "$art/content/envs-effect.tar" nix/store
          test -x "$entry"
          echo "artifact: run=$run_id id=$id digest=$digest entry=$entry"
          echo "ENVS_EFFECT_BIN=${entry%/envs-effect}" >>"$GITHUB_ENV"
          echo "ENVS_EFFECT_DIGEST=$digest" >>"$GITHUB_ENV"
          echo "ENVS_EFFECT_ZIP=$art/envs-effect.zip" >>"$GITHUB_ENV"

      - name: Provided artifact runs in the effect data-root shape
        env:
          ENVS_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if command -v nix; then
            echo "Nix is present on the effect-shape runner" >&2
            exit 1
          fi
          test "$("$ENVS_EFFECT_BIN/git" -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$ENVS_SOURCE_SHA"
          "$ENVS_EFFECT_BIN/envs-effect" --root "$GITHUB_WORKSPACE" toolchain | tee "$RUNNER_TEMP/identity.json"
          jq -e --arg sha "$ENVS_SOURCE_SHA" --arg root "$GITHUB_WORKSPACE" '.status == "PASS" and .source == $sha and .root == $root' "$RUNNER_TEMP/identity.json" >/dev/null
          "$ENVS_EFFECT_BIN/envs-effect" --root "$GITHUB_WORKSPACE" check
          "$ENVS_EFFECT_BIN/envs-effect" --root "$GITHUB_WORKSPACE" readiness
          "$ENVS_EFFECT_BIN/python3" -I checks/repository.py

  # Fresh consumer: no checkout, no Nix; obtains the provided artifact exactly as the effect workflows do.
  clean-start:
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Obtain provided effect artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ENVS_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          echo "platform: $ImageOS $ImageVersion"
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions"
          auth="Authorization: Bearer $GH_TOKEN"
          art="$(mktemp -d)"
          curl -fsSL -H "$auth" -o "$art/list.json" "$api/artifacts?name=envs-effect-$ENVS_SOURCE_SHA&per_page=100"
          jq -e '[.artifacts[] | select(.expired | not)] | length == 1 and (.[0].digest | test("^sha256:[0-9a-f]{64}$"))' "$art/list.json" >/dev/null
          jq '[.artifacts[] | select(.expired | not)][0]' "$art/list.json" >"$art/artifact.json"
          id="$(jq -r '.id' "$art/artifact.json")"
          digest="$(jq -r '.digest' "$art/artifact.json")"
          run_id="$(jq -r '.workflow_run.id' "$art/artifact.json")"
          curl -fsSL -H "$auth" -o "$art/run.json" "$api/runs/$run_id"
          jq -e --arg sha "$ENVS_SOURCE_SHA" --arg branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" --arg repo "$GITHUB_REPOSITORY" --arg current "$GITHUB_RUN_ID" \
            '.path == ".github/workflows/check.yml" and .head_sha == $sha and .head_branch == $branch and .repository.full_name == $repo and .head_repository.full_name == $repo and ((.id | tostring) == $current or (.event == "push" and .conclusion == "success"))' \
            "$art/run.json" >/dev/null
          curl -fsSL -H "$auth" -o "$art/envs-effect.zip" "$api/artifacts/$id/zip"
          echo "${digest#sha256:}  $art/envs-effect.zip" | sha256sum -c -
          unzip -q "$art/envs-effect.zip" -d "$art/content"
          test "$(ls -A "$art/content")" = envs-effect.tar
          test "$(tar -xOf "$art/content/envs-effect.tar" SOURCE)" = "$ENVS_SOURCE_SHA"
          entry="$(tar -xOf "$art/content/envs-effect.tar" ENTRY)"
          [[ "$entry" =~ ^/nix/store/[0-9a-z]{32}-envs-effect-toolchain/bin/envs-effect$ ]]
          sudo mkdir -p /nix/store
          sudo tar -x -C / -f "$art/content/envs-effect.tar" nix/store
          test -x "$entry"
          echo "artifact: run=$run_id id=$id digest=$digest entry=$entry"
          echo "ENVS_EFFECT_BIN=${entry%/envs-effect}" >>"$GITHUB_ENV"
          echo "ENVS_EFFECT_DIGEST=$digest" >>"$GITHUB_ENV"
          echo "ENVS_EFFECT_ZIP=$art/envs-effect.zip" >>"$GITHUB_ENV"

      - name: Clean start has no source checkout or Nix
        run: |
          set -euo pipefail
          test -z "$(ls -A "$GITHUB_WORKSPACE")"
          if command -v nix; then
            echo "Nix is present on the clean-start runner" >&2
            exit 1
          fi

      - name: Run provided entry and tools without credentials
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -euo pipefail
          "$ENVS_EFFECT_BIN/envs-effect" toolchain
          "$ENVS_EFFECT_BIN/envs-effect" check
          for tool in python3 sops git gh wrangler; do
            "$ENVS_EFFECT_BIN/$tool" --version
          done

      - name: Missing artifact is RED
        id: missing
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ENVS_SOURCE_SHA: "0000000000000000000000000000000000000000"
        run: |
          set -euo pipefail
          echo "platform: $ImageOS $ImageVersion"
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions"
          auth="Authorization: Bearer $GH_TOKEN"
          art="$(mktemp -d)"
          curl -fsSL -H "$auth" -o "$art/list.json" "$api/artifacts?name=envs-effect-$ENVS_SOURCE_SHA&per_page=100"
          jq -e '[.artifacts[] | select(.expired | not)] | length == 1 and (.[0].digest | test("^sha256:[0-9a-f]{64}$"))' "$art/list.json" >/dev/null
          jq '[.artifacts[] | select(.expired | not)][0]' "$art/list.json" >"$art/artifact.json"
          id="$(jq -r '.id' "$art/artifact.json")"
          digest="$(jq -r '.digest' "$art/artifact.json")"
          run_id="$(jq -r '.workflow_run.id' "$art/artifact.json")"
          curl -fsSL -H "$auth" -o "$art/run.json" "$api/runs/$run_id"
          jq -e --arg sha "$ENVS_SOURCE_SHA" --arg branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" --arg repo "$GITHUB_REPOSITORY" --arg current "$GITHUB_RUN_ID" \
            '.path == ".github/workflows/check.yml" and .head_sha == $sha and .head_branch == $branch and .repository.full_name == $repo and .head_repository.full_name == $repo and ((.id | tostring) == $current or (.event == "push" and .conclusion == "success"))' \
            "$art/run.json" >/dev/null
          curl -fsSL -H "$auth" -o "$art/envs-effect.zip" "$api/artifacts/$id/zip"
          echo "${digest#sha256:}  $art/envs-effect.zip" | sha256sum -c -
          unzip -q "$art/envs-effect.zip" -d "$art/content"
          test "$(ls -A "$art/content")" = envs-effect.tar
          test "$(tar -xOf "$art/content/envs-effect.tar" SOURCE)" = "$ENVS_SOURCE_SHA"
          entry="$(tar -xOf "$art/content/envs-effect.tar" ENTRY)"
          [[ "$entry" =~ ^/nix/store/[0-9a-z]{32}-envs-effect-toolchain/bin/envs-effect$ ]]
          sudo mkdir -p /nix/store
          sudo tar -x -C / -f "$art/content/envs-effect.tar" nix/store
          test -x "$entry"
          echo "artifact: run=$run_id id=$id digest=$digest entry=$entry"
          echo "ENVS_EFFECT_BIN=${entry%/envs-effect}" >>"$GITHUB_ENV"
          echo "ENVS_EFFECT_DIGEST=$digest" >>"$GITHUB_ENV"
          echo "ENVS_EFFECT_ZIP=$art/envs-effect.zip" >>"$GITHUB_ENV"

      - name: Missing, altered, or mismatched artifact is RED before tools run
        env:
          MISSING: ${{ steps.missing.outcome }}
        run: |
          set -euo pipefail
          test "$MISSING" = failure
          altered="$RUNNER_TEMP/altered.zip"
          cp "$ENVS_EFFECT_ZIP" "$altered"
          printf 'x' | dd of="$altered" bs=1 seek=4096 conv=notrunc status=none
          if echo "${ENVS_EFFECT_DIGEST#sha256:}  $altered" | sha256sum -c -; then
            echo "altered artifact was accepted" >&2
            exit 1
          fi
          source="$("$ENVS_EFFECT_BIN/envs-effect" toolchain | jq -r .root)"
          for case in lock adapter; do
            copy="$RUNNER_TEMP/mismatched-$case"
            cp -R "$source" "$copy"
            chmod -R u+w "$copy"
            if [ "$case" = lock ]; then
              jq '.nodes.nixpkgs.locked.narHash = "sha256-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="' "$source/flake.lock" >"$copy/flake.lock"
            else
              echo "# altered" >>"$copy/adapters/jev_api.py"
            fi
            if "$ENVS_EFFECT_BIN/envs-effect" --root "$copy" toolchain; then
              echo "mismatched $case was accepted" >&2
              exit 1
            fi
          done

      - name: Commit, event, or repository mismatch is RED before extraction
        env:
          GH_TOKEN: ${{ github.token }}
          ENVS_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions"
          auth="Authorization: Bearer $GH_TOKEN"
          art="$(mktemp -d)"
          curl -fsSL -H "$auth" -o "$art/producer.json" "$api/runs/$GITHUB_RUN_ID"
          for change in . \
            '.head_sha = "0000000000000000000000000000000000000000"' \
            '.id = 1 | .event = "pull_request"' \
            '.id = 1 | .event = "workflow_dispatch" | .conclusion = "success"' \
            '.repository.full_name = "fork/envs"' \
            '.head_repository.full_name = "fork/envs"' \
            '.path = ".github/workflows/other.yml"'; do
            jq "$change" "$art/producer.json" >"$art/run.json"
            if jq -e --arg sha "$ENVS_SOURCE_SHA" --arg branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" --arg repo "$GITHUB_REPOSITORY" --arg current "$GITHUB_RUN_ID" \
              '.path == ".github/workflows/check.yml" and .head_sha == $sha and .head_branch == $branch and .repository.full_name == $repo and .head_repository.full_name == $repo and ((.id | tostring) == $current or (.event == "push" and .conclusion == "success"))' \
              "$art/run.json" >/dev/null; then
              accepted=yes
            else
              accepted=no
            fi
            expected=no
            if [ "$change" = . ]; then
              expected=yes
            fi
            echo "producer $change: accepted=$accepted"
            test "$accepted" = "$expected"
          done
          mkdir "$art/content"
          echo 0000000000000000000000000000000000000000 >"$art/SOURCE"
          echo "$ENVS_EFFECT_BIN/envs-effect" >"$art/ENTRY"
          tar -cf "$art/content/envs-effect.tar" -C "$art" ENTRY SOURCE
          if test "$(tar -xOf "$art/content/envs-effect.tar" SOURCE)" = "$ENVS_SOURCE_SHA"; then
            echo "artifact built from another commit was accepted" >&2
            exit 1
          fi
          echo "artifact built from another commit: RED"
