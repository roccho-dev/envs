name: project-dev-rent-tunnel

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: project-dev-rent-tunnel
  cancel-in-progress: false

jobs:
  project:
    if: github.repository == 'roccho-dev/envs' && github.ref_name == 'proposals'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: dev-rent-tunnel
    steps:
      - name: Checkout exact canonical revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      # Consumes the artifact that check provided for this exact SHA; nothing is built or installed here.
      - name: Obtain provided effect artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ENVS_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "platform: $ImageOS $ImageVersion"
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions"
          auth="Authorization: Bearer $GH_TOKEN"
          art="$(mktemp -d)"
          curl -fsSL -H "$auth" -o "$art/list.json" "$api/artifacts?name=envs-effect-$ENVS_SOURCE_SHA&per_page=100"
          jq -e '[.artifacts[] | select(.expired | not)] | length == 1 and (.[0].digest | test("^sha256:[0-9a-f]{64}$"))' "$art/list.json" >/dev/null
          jq '[.artifacts[] | select(.expired | not)][0]' "$art/list.json" >"$art/artifact.json"
          id="$(jq -r '.id' "$art/artifact.json")"
          digest="$(jq -r '.digest' "$art/artifact.json")"
          run_id="$(jq -r '.workflow_run.id' "$art/artifact.json")"
          curl -fsSL -H "$auth" -o "$art/run.json" "$api/runs/$run_id"
          jq -e --arg sha "$ENVS_SOURCE_SHA" --arg branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" --arg repo "$GITHUB_REPOSITORY" --arg current "$GITHUB_RUN_ID" \
            '.path == ".github/workflows/check.yml" and .head_sha == $sha and .head_branch == $branch and .repository.full_name == $repo and .head_repository.full_name == $repo and ((.id | tostring) == $current or (.event == "push" and .conclusion == "success"))' \
            "$art/run.json" >/dev/null
          curl -fsSL -H "$auth" -o "$art/envs-effect.zip" "$api/artifacts/$id/zip"
          echo "${digest#sha256:}  $art/envs-effect.zip" | sha256sum -c -
          unzip -q "$art/envs-effect.zip" -d "$art/content"
          test "$(ls -A "$art/content")" = envs-effect.tar
          test "$(tar -xOf "$art/content/envs-effect.tar" SOURCE)" = "$ENVS_SOURCE_SHA"
          entry="$(tar -xOf "$art/content/envs-effect.tar" ENTRY)"
          [[ "$entry" =~ ^/nix/store/[0-9a-z]{32}-envs-effect-toolchain/bin/envs-effect$ ]]
          sudo mkdir -p /nix/store
          sudo tar -x -C / -f "$art/content/envs-effect.tar" nix/store
          test -x "$entry"
          echo "artifact: run=$run_id id=$id digest=$digest entry=$entry"
          echo "ENVS_EFFECT_BIN=${entry%/envs-effect}" >>"$GITHUB_ENV"
          echo "ENVS_EFFECT_DIGEST=$digest" >>"$GITHUB_ENV"
          echo "ENVS_EFFECT_ZIP=$art/envs-effect.zip" >>"$GITHUB_ENV"

      - name: Record effect toolchain identity
        run: '"$ENVS_EFFECT_BIN/envs-effect" --root "$GITHUB_WORKSPACE" toolchain'

      # Standard OpenTofu applies the persistent root on its encrypted, locked R2 backend; its sensitive credentials
      # output stays in memory and is sealed to the two target recipients. Secrets reach only the OpenTofu and SOPS
      # children by environment; a failure prints a closed kind and stage only.
      - name: Apply the persistent root and seal both envelopes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          RENT_STATE_PASSPHRASE: ${{ secrets.RENT_STATE_PASSPHRASE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          RENT_HOSTNAME: ${{ vars.RENT_HOSTNAME }}
          RENT_ORIGIN_SERVICE: ${{ vars.RENT_ORIGIN_SERVICE }}
          RENT_SERVICE_TOKEN_DURATION: ${{ vars.RENT_SERVICE_TOKEN_DURATION }}
          RENT_STATE_BUCKET: ${{ vars.RENT_STATE_BUCKET }}
          RENT_STATE_KEY: ${{ vars.RENT_STATE_KEY }}
          RENT_AGE_RECIPIENT: ${{ vars.RENT_AGE_RECIPIENT }}
          RENT_CLIENT_AGE_RECIPIENT: ${{ vars.RENT_CLIENT_AGE_RECIPIENT }}
        run: '"$ENVS_EFFECT_BIN/envs-effect" --root "$GITHUB_WORKSPACE" rent-root'

      - name: Verify candidate tree
        run: '"$ENVS_EFFECT_BIN/python3" -I checks/repository.py'

      - name: Open ciphertext handoff PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tool="$ENVS_EFFECT_BIN"
          branch="handoff/dev-rent-tunnel-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          "$tool/git" switch -c "$branch"
          "$tool/git" add ciphertexts/dev-rent-tunnel.sops.yaml ciphertexts/dev-rent-client.sops.yaml contracts/environments.jsonl
          "$tool/git" diff --cached --check
          "$tool/git" config user.name "roccho"
          "$tool/git" config user.email "40359643+roccho-dev@users.noreply.github.com"
          "$tool/git" commit -m "chore: hand off the dev rent root ciphertexts"
          "$tool/git" push origin "HEAD:refs/heads/$branch"
          "$tool/gh" pr create \
            --base proposals \
            --head "$branch" \
            --title "chore: hand off the dev rent root ciphertexts" \
            --body "Generated by the manual dev-rent-tunnel boundary. Contains the tunnel token and Access client credential ciphertexts, each for one target age recipient, with no plaintext value, API token, backend credential, state key or private age identity. The commit names the repository owner, the pushing actor is the workflow token and the commit is unsigned. Target apply and client access are not proven here."
