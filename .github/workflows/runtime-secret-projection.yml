name: project-dev

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-dev
  cancel-in-progress: false

jobs:
  project:
    if: github.repository == 'roccho-dev/envs' && github.ref_name == 'proposals'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: dev-projection
    env:
      APPLICATION: voice-ui
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      ENVS_SHA: ${{ github.sha }}
    steps:
      - name: Admit exact dev projection
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "roccho-dev/envs"
          test "$GITHUB_REF_NAME" = "proposals"
          test "$APPLICATION" = "voice-ui"
          test -n "$ENVS_SHA"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$SOPS_AGE_KEY"

      - name: Checkout exact envs authority
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact configured authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ENVS_SHA"
          bash scripts/runtime-secret-projection.sh check-configured

      - name: Install pinned Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes

      - name: Resolve pinned SOPS
        shell: bash
        run: |
          set -euo pipefail
          out="$(
            nix build --no-link --print-out-paths \
              github:NixOS/nixpkgs/f9948418dc8628ac02b6d6337e191ade9429d59d#sops
          )"
          test -x "$out/bin/sops"
          echo "SOPS_BIN=$out/bin/sops" >> "$GITHUB_ENV"

      - name: Project exact dev secret to target runtime
        shell: bash
        run: bash scripts/runtime-secret-projection.sh project

      - name: Emit non-secret receipt
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Dev secret projection"
            echo
            echo '~~~text'
            echo "status=PASS"
            echo "envs_sha=$ENVS_SHA"
            echo "stage=dev"
            echo "plane=projection"
            echo "source_kind=public_sops"
            echo "application=voice-ui"
            echo "target=cloudflare-pages/voice-ui"
            echo "secret_name=JEV_API_KEY"
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
