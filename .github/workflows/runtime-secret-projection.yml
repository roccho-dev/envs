name: project-dev

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-dev
  cancel-in-progress: false

jobs:
  project:
    if: github.repository == 'roccho-dev/envs' && github.ref_name == 'proposals'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: dev-projection
    permissions:
      contents: write
      pull-requests: write
    env:
      APPLICATION: voice-ui
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      ENVS_SHA: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Admit exact dev projection
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "roccho-dev/envs"
          test "$GITHUB_REF_NAME" = "proposals"
          test "$APPLICATION" = "voice-ui"
          test -n "$ENVS_SHA"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$SOPS_AGE_KEY"

      - name: Checkout exact envs authority
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact configured authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ENVS_SHA"
          bash scripts/runtime-secret-projection.sh check-configured

      - name: Install pinned Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes

      - name: Resolve pinned SOPS
        shell: bash
        run: |
          set -euo pipefail
          out="$(
            nix build --no-link --print-out-paths \
              github:NixOS/nixpkgs/f9948418dc8628ac02b6d6337e191ade9429d59d#sops
          )"
          test -x "$out/bin/sops"
          echo "SOPS_BIN=$out/bin/sops" >> "$GITHUB_ENV"

      - name: Project exact dev secret to target runtime
        shell: bash
        run: bash scripts/runtime-secret-projection.sh project

      - name: Build and validate non-secret projection receipt
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/dev-jev-api-projection-receipt.json"
          source_sha256="$(sha256sum secrets/jev-api-key.sops.yaml | awk '{print $1}')"
          created_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 scripts/projection_receipt.py build \
            --envs-sha "$ENVS_SHA" \
            --source-sha256 "$source_sha256" \
            --account-id "$CLOUDFLARE_ACCOUNT_ID" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --created-at "$created_at" \
            --output "$receipt"
          python3 scripts/projection_receipt.py check "$receipt"
          echo "PROJECTION_RECEIPT_PATH=$receipt" >> "$GITHUB_ENV"

      - name: Upload non-secret projection receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dev-jev-api-projection-receipt-${{ github.sha }}
          path: ${{ env.PROJECTION_RECEIPT_PATH }}
          if-no-files-found: error
          retention-days: 90

      - name: Open receipt-only handoff PR
        shell: bash
        run: |
          set -euo pipefail
          branch="handoff/dev-jev-api-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          install -D -m 0644 \
            "$PROJECTION_RECEIPT_PATH" \
            handoffs/dev/jev-api.json
          git add handoffs/dev/jev-api.json
          git diff --cached --check
          test "$(git diff --cached --name-only)" = "handoffs/dev/jev-api.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(handoff): record dev Jev projection"
          git push origin "HEAD:refs/heads/$branch"
          gh pr create \
            --base proposals \
            --head "$branch" \
            --title "record dev Jev projection handoff" \
            --body $'Records only the non-secret provider effect/readback receipt generated by the exact trusted projection run.\n\nThis receipt proves provider projection and name/presence readback only. It does not prove apps runtime acceptance or ops independent execution.'

      - name: Emit non-secret summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Dev secret projection"
            echo
            echo '~~~text'
            echo "status=PASS"
            echo "envs_sha=$ENVS_SHA"
            echo "stage=dev"
            echo "capability=jev-api"
            echo "source_kind=public_sops"
            echo "target=cloudflare-pages/voice-ui"
            echo "secret_name=JEV_API_KEY"
            echo "provider_readback=PASS"
            echo "handoff_pr=OPENED"
            echo "consumer_runtime_readiness=OUT_OF_SCOPE"
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
