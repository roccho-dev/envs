name: project-dev-authoring

on:
  pull_request:
    paths:
      - bindings/apps.jsonl
      - bindings/auth.jsonl
      - environments/**
      - secrets/**
      - .github/workflows/secret-materialize.yml
      - .github/workflows/runtime-secret-projection.yml
      - scripts/runtime-secret-projection.sh
      - scripts/bootstrap-dev-secret-plane.sh
      - tests/runtime-secret-projection-destructive.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-dev-authoring-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact proposal
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Verify dev source and target contracts
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/runtime-secret-projection.sh check
          bash tests/runtime-secret-projection-destructive.sh

  projection-admission:
    if: >-
      github.repository == 'roccho-dev/envs' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref_name == 'proposals'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: dev-projection
    outputs:
      recipient: ${{ steps.recipient.outputs.value }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
    steps:
      - name: Admit configured projection plane
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "roccho-dev/envs"
          test "$GITHUB_REF_NAME" = "proposals"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$SOPS_AGE_KEY"

      - name: Install pinned Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes

      - name: Resolve pinned age
        shell: bash
        run: |
          set -euo pipefail
          out="$(
            nix build --no-link --print-out-paths \
              github:NixOS/nixpkgs/f9948418dc8628ac02b6d6337e191ade9429d59d#age
          )"
          test -x "$out/bin/age-keygen"
          echo "AGE_KEYGEN_BIN=$out/bin/age-keygen" >> "$GITHUB_ENV"

      - name: Derive public recipient without exposing identity
        id: recipient
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          identity="$(mktemp "$RUNNER_TEMP/dev-age-identity.XXXXXX")"
          trap 'rm -f "$identity"' EXIT
          printf '%s\n' "$SOPS_AGE_KEY" > "$identity"
          recipient="$($AGE_KEYGEN_BIN -y "$identity")"
          [[ "$recipient" =~ ^age1[0-9a-z]+$ ]]
          printf 'value=%s\n' "$recipient" >> "$GITHUB_OUTPUT"

  author:
    needs: projection-admission
    if: >-
      github.repository == 'roccho-dev/envs' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref_name == 'proposals'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: dev-authoring
    permissions:
      contents: write
      pull-requests: write
    env:
      SOURCE_JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
      SOPS_AGE_RECIPIENTS: ${{ vars.SOPS_AGE_RECIPIENTS }}
      RUNTIME_RECIPIENT: ${{ needs.projection-admission.outputs.recipient }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout canonical compatibility branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: proposals
          fetch-depth: 0

      - name: Install pinned Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes

      - name: Resolve pinned SOPS
        shell: bash
        run: |
          set -euo pipefail
          out="$(
            nix build --no-link --print-out-paths \
              github:NixOS/nixpkgs/f9948418dc8628ac02b6d6337e191ade9429d59d#sops
          )"
          test -x "$out/bin/sops"
          printf 'SOPS_BIN=%s/bin/sops\n' "$out" >> "$GITHUB_ENV"

      - name: Encrypt and verify new dev authority
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$SOURCE_JEV_API_KEY"
          test -n "$SOPS_AGE_RECIPIENTS"
          test -n "$RUNTIME_RECIPIENT"

          export RECIPIENTS_JSON
          RECIPIENTS_JSON="$(python3 - <<'PY'
          import json
          import os
          import re

          values = [
              value.strip()
              for value in os.environ['SOPS_AGE_RECIPIENTS'].split(',')
              if value.strip()
          ]
          if os.environ['RUNTIME_RECIPIENT'] not in values:
              raise SystemExit('authoring recipients omit the configured projection identity')
          if len(values) != len(set(values)):
              raise SystemExit('duplicate recipients are forbidden')
          if not all(re.fullmatch(r'age1[0-9a-z]+', value) for value in values):
              raise SystemExit('malformed age recipient')
          print(json.dumps(sorted(values)))
          PY
          )"

          tmp="$(mktemp -d "$RUNNER_TEMP/jev-secret.XXXXXX")"
          trap 'rm -rf "$tmp"' EXIT
          plain="$tmp/plain.json"
          cipher="$tmp/cipher.yaml"
          export PLAIN_PATH="$plain"
          export CIPHER_PATH="$cipher"

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          Path(os.environ['PLAIN_PATH']).write_text(
              json.dumps({'JEV_API_KEY': os.environ['SOURCE_JEV_API_KEY']}, separators=(',', ':')) + '\n',
              encoding='utf-8',
          )
          PY

          "$SOPS_BIN" --encrypt --input-type json --output-type yaml \
            --age "$SOPS_AGE_RECIPIENTS" \
            "$plain" > "$cipher"

          grep -q '^JEV_API_KEY: ENC\[AES256_GCM,' "$cipher"
          grep -q '^sops:' "$cipher"
          ! grep -q 'AGE-SECRET-KEY-1' "$cipher"

          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          path = Path(os.environ['CIPHER_PATH'])
          body = path.read_bytes()
          if os.environ['SOURCE_JEV_API_KEY'].encode() in body:
              raise SystemExit('plaintext survived encryption')
          actual = sorted(re.findall(
              r'(?m)^\s*recipient:\s*(age1[0-9a-z]+)\s*$',
              path.read_text(encoding='utf-8'),
          ))
          expected = json.loads(os.environ['RECIPIENTS_JSON'])
          if actual != expected:
              raise SystemExit('ciphertext recipient mismatch')
          PY

          install -D -m 0600 "$cipher" secrets/jev-api-key.sops.yaml

      - name: Activate only the configured dev planes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('environments/secret-planes.jsonl')
          rows = []
          for line in path.read_text(encoding='utf-8').splitlines():
              if not line.strip():
                  continue
              row = json.loads(line)
              if row['id'] == 'dev.authoring':
                  row['active_github_environment'] = 'dev-authoring'
                  row['migration_state'] = 'ACTIVE'
              elif row['id'] == 'dev.projection':
                  row['active_github_environment'] = 'dev-projection'
                  row['migration_state'] = 'ACTIVE'
              rows.append(row)
          path.write_text(
              ''.join(json.dumps(row, separators=(',', ':')) + '\n' for row in rows),
              encoding='utf-8',
          )
          PY
          bash scripts/runtime-secret-projection.sh check-configured

      - name: Open ciphertext-only authority PR
        shell: bash
        run: |
          set -euo pipefail
          branch="secret/dev-authority-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git add secrets/jev-api-key.sops.yaml environments/secret-planes.jsonl
          git diff --cached --check
          test "$(git diff --cached --name-only | sort)" = $'environments/secret-planes.jsonl\nsecrets/jev-api-key.sops.yaml'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(secrets): activate new dev authority"
          git push origin "HEAD:refs/heads/$branch"
          gh pr create \
            --base proposals \
            --head "$branch" \
            --title "activate new dev SOPS authority" \
            --body $'Generated only from the newly configured dev-authoring and dev-projection Environments.\n\nAfter merge, delete the one-shot JEV_API_KEY from dev-authoring, then run project-dev on proposals.'
