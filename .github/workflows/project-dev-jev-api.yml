name: project-dev-jev-api

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: project-dev-jev-api
  cancel-in-progress: false

jobs:
  project:
    if: github.repository == 'roccho-dev/envs' && github.ref_name == 'proposals'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: dev-projection
    steps:
      - name: Checkout exact canonical revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install pinned Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes

      - name: Project and read back target-native auth
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_PACKAGE: wrangler@4.112.0
        run: >-
          nix shell
          github:NixOS/nixpkgs/f9948418dc8628ac02b6d6337e191ade9429d59d#sops
          github:NixOS/nixpkgs/f9948418dc8628ac02b6d6337e191ade9429d59d#nodejs_22
          -c python3 adapters/jev_api.py project
          --envs-sha "${GITHUB_SHA}"
          --run-id "${GITHUB_RUN_ID}"
          --run-attempt "${GITHUB_RUN_ATTEMPT}"

      - name: Verify candidate handoff
        run: python3 checks/repository.py

      - name: Open non-secret handoff PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="handoff/dev-jev-api-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git add handoffs/dev-jev-api.json
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: record dev Jev projection handoff"
          git push origin "HEAD:refs/heads/$branch"
          gh pr create \
            --base proposals \
            --head "$branch" \
            --title "chore: record dev Jev projection handoff" \
            --body "Generated after provider effect and name-only readback. Contains no plaintext secret, private key, or secret-value hash."
