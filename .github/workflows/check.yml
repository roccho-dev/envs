name: check

on:
  pull_request:
    branches:
      - proposals
  push:
    branches:
      - proposals
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: check-${{ github.ref }}
  # Never cancel a proposals push run: it provides the artifact that SHA's effect dispatch consumes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repository:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check repository contract
        run: python3 checks/repository.py

      - name: Test repository oracle
        run: python3 checks/test_repository.py

      - name: Test Jev adapter
        run: python3 checks/test_jev_api.py

      - name: Test rent tunnel adapter
        run: python3 checks/test_rent_tunnel.py

      - name: Test access probe adapter
        run: python3 checks/test_rent_access_probe.py

      - name: Test state proof adapter
        run: python3 checks/test_rent_state_proof.py

      - name: Test Linode read probe adapter
        run: python3 checks/test_linode_read_probe.py

      - name: Verify explicit main compatibility refresh
        if: github.ref_name == 'main'
        run: python3 checks/repository.py --verify-main-compatibility-refresh

  # placement-gate (windows #14): the actual CI outputs for each platform in one run of this exact source.
  # placement-artifact builds the small Windows placement distribution; placement-author projects synthetic envelopes
  # with the provided Linux artifact; placement-windows binds the exact published windows Release and runs place.ps1
  # into windows' own released stdin reader; placement-rent runs the receiver in the rent image that Release names.
  # Synthetic values only: no provider, real target, packaged Codex, -Mode RentAccess host glue or WSLC is proven.
  placement-artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ENVS_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes

      - name: Build the Windows placement distribution
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ENVS_SOURCE_SHA"
          nix build .#placement-artifact --no-update-lock-file --print-build-logs --out-link "$RUNNER_TEMP/placement"
          test "$(cat "$RUNNER_TEMP/placement/SOURCE")" = "$ENVS_SOURCE_SHA"
          echo "cb6fec76e23cb4ac56771ac38472b0fe1ba79a849bf2200aeda7c9467a045b7b  $RUNNER_TEMP/placement/sops.exe" | sha256sum -c -
          cmp adapters/place.ps1 "$RUNNER_TEMP/placement/place.ps1"
          cmp adapters/rent-receive.sh "$RUNNER_TEMP/placement/rent-receive.sh"
          # The redistributed binaries travel with their exact license texts and this repository's notice.
          test -s "$RUNNER_TEMP/placement/age-keygen.exe"
          cmp LICENSES/age-v1.3.2.txt "$RUNNER_TEMP/placement/LICENSES/age-v1.3.2.txt"
          cmp LICENSES/sops-v3.13.2.txt "$RUNNER_TEMP/placement/LICENSES/sops-v3.13.2.txt"
          cmp LICENSES/README.md "$RUNNER_TEMP/placement/LICENSES/README.md"
          cmp THIRD_PARTY_NOTICES.md "$RUNNER_TEMP/placement/THIRD_PARTY_NOTICES.md"
          mkdir "$RUNNER_TEMP/provide-placement"
          cp -RL "$RUNNER_TEMP/placement/." "$RUNNER_TEMP/provide-placement/"

      - name: Provide the Windows placement distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: envs-placement-${{ env.ENVS_SOURCE_SHA }}
          path: ${{ runner.temp }}/provide-placement/
          if-no-files-found: error

  placement-author:
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ENVS_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source commit as data root
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Obtain the provided Linux artifact of this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: envs-effect-${{ env.ENVS_SOURCE_SHA }}
          path: ${{ runner.temp }}/effect

      - name: Obtain the synthetic placement identities of this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: placement-identities-${{ env.ENVS_SOURCE_SHA }}
          path: ${{ runner.temp }}/placement-identities

      # The provided entry projects a synthetic root output (stdin) into the client envelope; the adapter of the same
      # commit seals a synthetic tunnel token with the closure sops. Values stay in shell variables and pipes.
      - name: Synthetic envelopes from the provided Linux artifact
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ENVS_SOURCE_SHA"
          test "$(tar -xOf "$RUNNER_TEMP/effect/envs-effect.tar" SOURCE)" = "$ENVS_SOURCE_SHA"
          entry="$(tar -xOf "$RUNNER_TEMP/effect/envs-effect.tar" ENTRY)"
          [[ "$entry" =~ ^/nix/store/[0-9a-z]{32}-envs-effect-toolchain/bin/envs-effect$ ]]
          sudo mkdir -p /nix/store
          sudo tar -x -C / -f "$RUNNER_TEMP/effect/envs-effect.tar" nix/store
          tool="${entry%/envs-effect}"
          keys="$RUNNER_TEMP/placement-identities"
          out="$RUNNER_TEMP/placement-inputs"
          data="$RUNNER_TEMP/data"
          mkdir "$out" "$data"
          git archive HEAD | tar -x -C "$data"
          client_id="ci$(head -c 12 /dev/urandom | od -An -tx1 | tr -d ' \n').access"
          client_secret="$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          tunnel="$(head -c 96 /dev/urandom | base64 -w0)"
          printf '{"tunnel_token":"%s","service_token_id":"%s","service_token_value":"%s"}' "$tunnel" "$client_id" "$client_secret" |
            RENT_CLIENT_AGE_RECIPIENT="$(cat "$keys/client.pub")" "$entry" --root "$data" rent-client
          cp "$data/ciphertexts/dev-rent-client.sops.yaml" "$out/client.sops.yaml"
          printf '%s' "$tunnel" | "$tool/python3" -I -c 'import importlib.util, sys
          spec = importlib.util.spec_from_file_location("jev", sys.argv[1]); jev = importlib.util.module_from_spec(spec); spec.loader.exec_module(jev)
          sys.stdout.buffer.write(jev.encrypt_rent_token(sys.stdin.read(), sys.argv[2], {"sops": sys.argv[3]}))' \
            "$data/adapters/jev_api.py" "$(cat "$keys/rent.pub")" "$tool/sops" >"$out/rent.sops.yaml"
          # A well-formed envelope whose client ID is far beyond the slot bound: place.ps1 must stop reading it.
          printf '{"RENT_ACCESS_CLIENT_ID":"%s","RENT_ACCESS_CLIENT_SECRET":"x"}' "$(head -c 300000 /dev/zero | tr '\0' a)" |
            SOPS_AGE_RECIPIENTS="$(cat "$keys/client.pub")" "$tool/sops" --encrypt --input-type json --output-type yaml /dev/stdin >"$out/oversize.sops.yaml"
          SOPS_AGE_KEY_FILE="$keys/client.key" "$tool/sops" --decrypt --input-type yaml --output-type json "$out/client.sops.yaml" |
            CID="$client_id" CSECRET="$client_secret" jq -e '. == {RENT_ACCESS_CLIENT_ID: env.CID, RENT_ACCESS_CLIENT_SECRET: env.CSECRET}' >/dev/null
          # The synthetic values and the slot digests the targets must receive, for the gate jobs' checks only.
          printf '{"client_id":"%s","client_secret":"%s","tunnel":"%s","client_slot_sha256":"%s","tunnel_sha256":"%s"}\n' \
            "$client_id" "$client_secret" "$tunnel" \
            "$(printf '%s\n%s\n' "$client_id" "$client_secret" | sha256sum | cut -d ' ' -f 1)" \
            "$(printf '%s' "$tunnel" | sha256sum | cut -d ' ' -f 1)" >"$out/values.json"

      - name: Provide the synthetic placement inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: placement-inputs-${{ env.ENVS_SOURCE_SHA }}
          path: ${{ runner.temp }}/placement-inputs/
          if-no-files-found: error
          retention-days: 1

  placement-windows:
    needs: [placement-artifact, placement-author]
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      rent_image: ${{ steps.release.outputs.rent_image }}
      windows_source: ${{ steps.release.outputs.windows_source }}
    env:
      ENVS_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Obtain the Windows placement distribution of this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: envs-placement-${{ env.ENVS_SOURCE_SHA }}
          path: ${{ runner.temp }}/placement

      - name: Obtain the synthetic placement inputs of this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: placement-inputs-${{ env.ENVS_SOURCE_SHA }}
          path: ${{ runner.temp }}/placement-inputs

      - name: Obtain the synthetic placement identities of this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: placement-identities-${{ env.ENVS_SOURCE_SHA }}
          path: ${{ runner.temp }}/placement-identities

      # Gate A: the windows Release of the exact declared source, published by github-actions[bot] from a push run whose
      # publication chain passed (scope, build, the Windows proof, the rent image job, publish), with every asset equal to
      # GitHub's own asset digest; the client distribution's bytes equal its .sha256, rent-image.json names this source.
      - name: Bind the exact published windows Release
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          function Api([string]$Path, [string[]]$Fields = @()) {
            $argv = @('api', '-X', 'GET', $Path) + @($Fields | ForEach-Object { '-f'; $_ })
            $text = (& gh @argv) -join "`n"
            if ($LASTEXITCODE -ne 0) { throw "GitHub read failed: $Path" }
            return $text | ConvertFrom-Json
          }
          function Sha([string]$Path) { (Get-FileHash -LiteralPath $Path -Algorithm SHA256).Hash.ToLowerInvariant() }
          $consumer = @(Get-Content contracts/provider-consumer.jsonl | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.id -ceq 'windows.rent.consumer' })
          $source = $consumer[0].distribution_source
          if ($consumer.Count -ne 1 -or $source -cnotmatch '^[0-9a-f]{40}$') { throw 'no exact windows distribution source' }
          $repo, $tag = 'repos/roccho-dev/windows', "windows-$source"
          $ref = Api "$repo/git/ref/tags/$tag"
          if ($ref.object.type -cne 'commit' -or $ref.object.sha -cne $source) { throw 'the Release tag does not name the exact windows commit' }
          $release = Api "$repo/releases/tags/$tag"
          if ($release.author.login -cne 'github-actions[bot]' -or $release.draft) { throw 'the Release is not a published github-actions[bot] Release' }
          $assets = @($release.assets)
          if ((@($assets.name | Sort-Object) -join ',') -cne 'rent-image.json,windows-dist.zip,windows-dist.zip.sha256') { throw 'the Release asset set differs' }
          foreach ($asset in $assets) {
            if ($asset.uploader.login -cne 'github-actions[bot]' -or [string]$asset.digest -cnotmatch '^sha256:[0-9a-f]{64}$') { throw "asset $($asset.name) has no trusted uploader or digest" }
          }
          $required = 'scope', 'build', 'windows', 'rent / build-test-publish', 'publish'
          $published = $null
          foreach ($run in @((Api "$repo/actions/runs" @("head_sha=$source", 'event=push', 'per_page=20')).workflow_runs)) {
            if ($run.path -cne '.github/workflows/ci.yml' -or $run.head_branch -cne 'proposals' -or $run.head_sha -cne $source) { continue }
            $jobs = @((Api "$repo/actions/runs/$($run.id)/jobs" @('per_page=100')).jobs)
            if (@($required | Where-Object { $name = $_; -not @($jobs | Where-Object { $_.name -ceq $name -and $_.conclusion -ceq 'success' }).Count }).Count -eq 0) { $published = $run; break }
          }
          if ($null -eq $published) { throw 'no push run of the exact windows source passed its publication chain' }
          $dir = Join-Path $env:RUNNER_TEMP 'windows-release'
          & gh release download $tag --repo roccho-dev/windows --dir $dir
          if ($LASTEXITCODE -ne 0) { throw 'the Release assets could not be read' }
          foreach ($asset in $assets) {
            if ('sha256:' + (Sha (Join-Path $dir $asset.name)) -cne $asset.digest) { throw "asset $($asset.name) differs from its GitHub digest" }
          }
          $zip = Join-Path $dir 'windows-dist.zip'
          if ((Get-Content -LiteralPath "$zip.sha256" -Raw).Split(' ')[0] -cne (Sha $zip)) { throw 'windows-dist.zip differs from its published .sha256' }
          $image = Get-Content -LiteralPath (Join-Path $dir 'rent-image.json') -Raw | ConvertFrom-Json
          if ($image.kind -cne 'windows.rentImage.v1' -or $image.source -cne $source -or $image.image -cnotmatch '^ghcr\.io/roccho-dev/windows-rent@sha256:[0-9a-f]{64}$') { throw 'rent-image.json does not bind this source to one pushed image' }
          Expand-Archive -LiteralPath $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'windows-dist')
          "windows Release ${tag}: run $($published.id), windows-dist.zip $(Sha $zip), rent image $($image.image)"
          "rent_image=$($image.image)" >> $env:GITHUB_OUTPUT
          "windows_source=$source" >> $env:GITHUB_OUTPUT

      # The actual place.ps1 in Windows PowerShell 5.1 hands the client credential to windows' own released stdin reader
      # and slot rule (ReadRentAccessInput, Get-RentAccessProblem from the bound windows-dist), started exactly as it
      # starts win.ps1 -Mode RentAccess. The host caller, ledger and slot write were proved by the windows proof.
      - name: place.ps1 into the released Windows stdin reader, with leak and refusal checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $temp = $env:RUNNER_TEMP
          $placement, $inputs, $keys = "$temp\placement", "$temp\placement-inputs", "$temp\placement-identities"
          $values = Get-Content -LiteralPath "$inputs\values.json" -Raw | ConvertFrom-Json
          $harness = New-Item -ItemType Directory -Path "$temp\reader"
          Set-Content -LiteralPath "$harness\win.ps1" -Encoding ascii -Value @'
          param([string]$Mode)
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          if ($Mode -cne 'RentAccess') { exit 9 }
          $ast = [Management.Automation.Language.Parser]::ParseFile((Join-Path $env:PLACEMENT_WINDOWS_DIST 'win.ps1'), [ref]$null, [ref]$null)
          foreach ($d in $ast.FindAll({ param($n) $n -is [Management.Automation.Language.FunctionDefinitionAst] -and $n.Name -cin @('ReadRentAccessInput', 'Get-RentAccessProblem') }, $false)) { . ([scriptblock]::Create($d.Extent.Text)) }
          $bytes = ReadRentAccessInput
          $problem = Get-RentAccessProblem $bytes
          $hash = [Security.Cryptography.SHA256]::Create()
          $me = @(([wmisearcher]"SELECT CommandLine, ParentProcessId FROM Win32_Process WHERE ProcessId = $PID").Get())[0]
          $parent = @(([wmisearcher]"SELECT CommandLine FROM Win32_Process WHERE ProcessId = $($me.ParentProcessId)").Get())[0]
          @{ problem = $problem; length = $bytes.Length; sha256 = (-join ($hash.ComputeHash($bytes) | ForEach-Object { $_.ToString('x2') }))
             commandLines = @([string]$me.CommandLine, [string]$parent.CommandLine) } | ConvertTo-Json -Compress | Set-Content -LiteralPath $env:PLACEMENT_VERDICT -Encoding ascii
          if ($problem) { exit 3 }
          exit 0
          '@
          Set-Content -LiteralPath "$temp\driver.ps1" -Encoding ascii -Value @'
          param([string]$Placement, [string]$Identity, [string]$Envelope, [string]$Reader, [string]$Transcript)
          Start-Transcript -LiteralPath $Transcript | Out-Null
          & (Join-Path $Placement 'place.ps1') -Target client -Identity $Identity -Ciphertext $Envelope -WindowsDist $Reader
          $code = $LASTEXITCODE
          Stop-Transcript | Out-Null
          exit $code
          '@
          function Place([string]$Identity, [string]$Envelope) {
            $id = [guid]::NewGuid().ToString('N')
            $verdict, $transcript = "$temp\verdict-$id.json", "$temp\transcript-$id.txt"
            $info = [Diagnostics.ProcessStartInfo]::new("$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe",
              "-NoProfile -NonInteractive -ExecutionPolicy Bypass -File `"$temp\driver.ps1`" -Placement `"$placement`" -Identity `"$Identity`" -Envelope `"$Envelope`" -Reader `"$harness`" -Transcript `"$transcript`"")
            $info.UseShellExecute = $false; $info.RedirectStandardOutput = $true; $info.RedirectStandardError = $true
            $info.EnvironmentVariables.Remove('PSModulePath')
            $info.EnvironmentVariables['PLACEMENT_WINDOWS_DIST'] = "$temp\windows-dist"
            $info.EnvironmentVariables['PLACEMENT_VERDICT'] = $verdict
            $process = [Diagnostics.Process]::Start($info)
            $out, $err = $process.StandardOutput.ReadToEndAsync(), $process.StandardError.ReadToEndAsync()
            if (-not $process.WaitForExit(120000)) { $process.Kill($true); throw 'place.ps1 did not finish' }
            $process.WaitForExit()
            $seen = $out.Result + $err.Result + $(if (Test-Path -LiteralPath $transcript) { [IO.File]::ReadAllText($transcript) } else { '' })
            if ($seen.Contains($values.client_secret) -or $seen.Contains($values.client_id)) { throw 'a credential reached ordinary output, the transcript or the log' }
            [pscustomobject]@{ code = $process.ExitCode; stderr = $err.Result
              verdict = $(if (Test-Path -LiteralPath $verdict) { Get-Content -LiteralPath $verdict -Raw | ConvertFrom-Json } else { $null }) }
          }
          $placed = Place "$keys\client.key" "$inputs\client.sops.yaml"
          if ($placed.code -ne 0 -or $null -eq $placed.verdict -or $null -ne $placed.verdict.problem -or $placed.verdict.sha256 -cne $values.client_slot_sha256) { throw "the released reader did not accept the exact slot bytes (exit $($placed.code))" }
          if (@($placed.verdict.commandLines | Where-Object { $_.Contains($values.client_secret) -or $_.Contains($values.client_id) }).Count) { throw 'a credential reached a command line' }
          $wrong = Place "$keys\rent.key" "$inputs\client.sops.yaml"
          if ($wrong.code -ne 2 -or $null -ne $wrong.verdict -or $wrong.stderr -notlike 'place: decryption failed; nothing placed.*') { throw 'a wrong identity was not refused before the writer' }
          $text = [IO.File]::ReadAllText("$inputs\client.sops.yaml")
          $start = $text.IndexOf('ENC[AES256_GCM,data:') + 20
          [IO.File]::WriteAllText("$temp\tampered.sops.yaml", $text.Substring(0, $start) + $(if ($text[$start] -ceq 'A') { 'B' } else { 'A' }) + $text.Substring($start + 1))
          $tampered = Place "$keys\client.key" "$temp\tampered.sops.yaml"
          if ($tampered.code -ne 2 -or $null -ne $tampered.verdict) { throw 'a tampered envelope was not refused before the writer' }
          $oversize = Place "$keys\client.key" "$inputs\oversize.sops.yaml"
          if ($oversize.code -ne 2 -or $null -ne $oversize.verdict -or $oversize.stderr -notlike 'place: the decrypted value exceeds its bound; nothing placed.*') { throw 'an oversized value was not stopped at its bound' }
          # The rent branch refuses a non-digest image before any decryption; running it through WSLC is a deployment gate.
          $info = [Diagnostics.ProcessStartInfo]::new("$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe",
            "-NoProfile -NonInteractive -ExecutionPolicy Bypass -File `"$placement\place.ps1`" -Target rent -Identity `"$keys\rent.key`" -Ciphertext `"$inputs\rent.sops.yaml`" -RentImage ghcr.io/roccho-dev/windows-rent:latest")
          $info.UseShellExecute = $false; $info.RedirectStandardOutput = $true; $info.RedirectStandardError = $true; $info.EnvironmentVariables.Remove('PSModulePath')
          $process = [Diagnostics.Process]::Start($info); $err = $process.StandardError.ReadToEndAsync(); $null = $process.StandardOutput.ReadToEndAsync()
          if (-not $process.WaitForExit(60000)) { $process.Kill($true); throw 'place.ps1 -Target rent did not finish' }
          if ($process.ExitCode -ne 2 -or $err.Result -notlike 'place: the rent image is not one exact digest; nothing placed.*') { throw 'a tag-named rent image was not refused' }
          foreach ($file in Get-ChildItem -LiteralPath $temp -Recurse -File | Where-Object { $_.FullName -ne "$inputs\values.json" }) {
            $bytes = [IO.File]::ReadAllBytes($file.FullName)
            if ([Text.Encoding]::ASCII.GetString($bytes).Contains($values.client_secret)) { throw "a credential reached the file $($file.Name)" }
          }
          'place.ps1 -> released ReadRentAccessInput/Get-RentAccessProblem: exact slot bytes; wrong identity and tampered envelope refused before the writer; no credential in output, transcript, command lines or files'

      # The bundled age-keygen.exe exactly as a target would use it, in Windows PowerShell 5.1 on a synthetic key in a
      # fresh scratch directory: the key file inherits the directory's owner-only ACL (Windows ignores Go's 0600), only
      # the public recipient leaves the tool, the bundled sops decrypts with the key, and an existing key is never
      # overwritten. The key never leaves this runner; nothing of this step is uploaded.
      - name: Bundled age-keygen.exe makes, reads back and never overwrites a target identity
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $placement = Join-Path $env:RUNNER_TEMP 'placement'
          $keygen, $sops = (Join-Path $placement 'age-keygen.exe'), (Join-Path $placement 'sops.exe')
          $seen = New-Object Text.StringBuilder
          function Run([string]$Exe, [string[]]$Arguments, [hashtable]$Environment = @{}) {
            $info = New-Object Diagnostics.ProcessStartInfo $Exe
            $info.Arguments = (@($Arguments | ForEach-Object { '"' + $_ + '"' })) -join ' '
            $info.UseShellExecute = $false; $info.RedirectStandardOutput = $true; $info.RedirectStandardError = $true
            foreach ($name in $Environment.Keys) { $info.EnvironmentVariables[$name] = $Environment[$name] }
            $process = [Diagnostics.Process]::Start($info)
            $out, $err = $process.StandardOutput.ReadToEndAsync(), $process.StandardError.ReadToEndAsync()
            if (-not $process.WaitForExit(60000)) { $process.Kill(); throw "$Exe did not finish" }
            $process.WaitForExit()
            $null = $seen.Append($out.Result).Append($err.Result)
            [pscustomobject]@{ code = $process.ExitCode; out = $out.Result; err = $err.Result }
          }
          $version = Run $keygen @('--version')
          if ($version.code -ne 0 -or $version.out.Trim() -cnotmatch '^v?1\.3\.2$') { throw 'the bundled age-keygen.exe is not age 1.3.2' }
          # An owner-only scratch directory: one inheritable full-control entry for this user, no inherited entries.
          $me = [Security.Principal.WindowsIdentity]::GetCurrent()
          $scratch = Join-Path $env:RUNNER_TEMP ('age-target-' + [guid]::NewGuid().ToString('N'))
          $null = New-Item -ItemType Directory -Path $scratch
          $acl = New-Object Security.AccessControl.DirectorySecurity
          $acl.SetOwner($me.User)
          $acl.SetAccessRuleProtection($true, $false)
          $acl.AddAccessRule((New-Object Security.AccessControl.FileSystemAccessRule($me.User, 'FullControl', 'ContainerInherit,ObjectInherit', 'None', 'Allow')))
          (New-Object IO.DirectoryInfo $scratch).SetAccessControl($acl)
          $key = Join-Path $scratch 'target.key'
          $made = Run $keygen @('-o', $key)
          if ($made.code -ne 0 -or -not (Test-Path -LiteralPath $key -PathType Leaf)) { throw "age-keygen -o did not create the key (exit $($made.code))" }
          if ($made.err -cnotmatch 'Public key: (age1[0-9a-z]{58})') { throw 'age-keygen -o did not report one public recipient' }
          $recipient = $Matches[1]
          if (@([IO.File]::ReadAllLines($key) | Where-Object { $_ -cmatch '^AGE-SECRET-KEY-1[0-9A-Z]+$' }).Count -ne 1) { throw 'the key file does not hold exactly one identity' }
          $public = Run $keygen @('-y', $key)
          if ($public.code -ne 0 -or $public.out.Trim() -cne $recipient) { throw 'age-keygen -y does not return the same public recipient' }
          # The key file's security: owned as this token creates files, and only the directory's inherited entry.
          $fileAcl = (New-Object IO.FileInfo $key).GetAccessControl()
          $sid = [Security.Principal.SecurityIdentifier]
          if ($fileAcl.GetOwner($sid) -ne $me.Owner) { throw 'the key file is not owned by the creating token owner' }
          $rules = @($fileAcl.GetAccessRules($true, $true, $sid))
          if ($rules.Count -lt 1 -or @($rules | Where-Object { $_.IdentityReference -ne $me.User -or -not $_.IsInherited -or $_.AccessControlType -ne 'Allow' }).Count) { throw 'the key file grants more than the owner-only directory entry' }
          # The bundled sops: encrypt a synthetic value to the recipient, decrypt it with the key file.
          $value = [guid]::NewGuid().ToString('N')
          $plain, $sealed = (Join-Path $scratch 'synthetic.json'), (Join-Path $scratch 'synthetic.sops.json')
          [IO.File]::WriteAllText($plain, '{"synthetic":"' + $value + '"}')
          $encrypted = Run $sops @('--encrypt', '--age', $recipient, '--input-type', 'json', '--output-type', 'json', $plain)
          if ($encrypted.code -ne 0 -or $encrypted.out.Contains($value)) { throw 'the bundled sops did not encrypt to the recipient' }
          [IO.File]::WriteAllText($sealed, $encrypted.out)
          $decrypted = Run $sops @('--decrypt', '--input-type', 'json', '--output-type', 'json', $sealed) @{ SOPS_AGE_KEY_FILE = $key }
          if ($decrypted.code -ne 0 -or ($decrypted.out | ConvertFrom-Json).synthetic -cne $value) { throw 'the bundled sops did not decrypt with the key file' }
          # An existing identity is never replaced: a second -o fails and leaves the bytes as they were.
          $before = [IO.File]::ReadAllBytes($key)
          $again = Run $keygen @('-o', $key)
          if ($again.code -eq 0) { throw 'a second age-keygen -o succeeded over an existing key' }
          if ([Convert]::ToBase64String([IO.File]::ReadAllBytes($key)) -cne [Convert]::ToBase64String($before)) { throw 'a second age-keygen -o changed the existing key' }
          if ($seen.ToString().Contains('AGE-SECRET-KEY-1')) { throw 'an identity reached ordinary output' }
          "bundled age-keygen.exe $($version.out.Trim()): owner-only inherited ACL, public recipient readback, sops roundtrip, second -o refused (exit $($again.code)) with the key unchanged"

  placement-rent:
    needs: [toolchain, placement-artifact, placement-author, placement-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ENVS_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      RENT_IMAGE: ${{ needs.placement-windows.outputs.rent_image }}
      WINDOWS_SOURCE: ${{ needs.placement-windows.outputs.windows_source }}
    steps:
      - name: Obtain the provided Linux artifact of this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: envs-effect-${{ env.ENVS_SOURCE_SHA }}
          path: ${{ runner.temp }}/effect

      - name: Obtain the Windows placement distribution of this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: envs-placement-${{ env.ENVS_SOURCE_SHA }}
          path: ${{ runner.temp }}/placement

      - name: Obtain the synthetic placement inputs of this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: placement-inputs-${{ env.ENVS_SOURCE_SHA }}
          path: ${{ runner.temp }}/placement-inputs

      - name: Obtain the synthetic placement identities of this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: placement-identities-${{ env.ENVS_SOURCE_SHA }}
          path: ${{ runner.temp }}/placement-identities

      # The rent image the bound Release names, by digest; the registry tag must still resolve to that digest.
      # rent-receive.sh from the placement distribution runs in it on a scratch state volume, fed by the closure sops
      # through a pipe. Docker stands in for WSLC here: this proves the receiver, not WSLC.
      - name: rent-receive.sh in the released rent image
        run: |
          set -euo pipefail
          [[ "$RENT_IMAGE" =~ ^ghcr\.io/roccho-dev/windows-rent@(sha256:[0-9a-f]{64})$ ]]
          digest="${BASH_REMATCH[1]}"
          [[ "$WINDOWS_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          # Anonymous pull token, passed to curl on stdin, never in argv.
          token="$(curl -fsS 'https://ghcr.io/token?scope=repository:roccho-dev/windows-rent:pull' | jq -r .token)"
          remote="$(printf 'header = "Authorization: Bearer %s"\n' "$token" | curl -fsSI -K - \
            -H 'Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
            "https://ghcr.io/v2/roccho-dev/windows-rent/manifests/sha-$WINDOWS_SOURCE" | tr -d '\r' | sed -nE 's/^[Dd]ocker-[Cc]ontent-[Dd]igest: (sha256:[0-9a-f]{64})$/\1/p')"
          test "$remote" = "$digest"
          docker pull "$RENT_IMAGE"
          test "$(tar -xOf "$RUNNER_TEMP/effect/envs-effect.tar" SOURCE)" = "$ENVS_SOURCE_SHA"
          test "$(cat "$RUNNER_TEMP/placement/SOURCE")" = "$ENVS_SOURCE_SHA"
          entry="$(tar -xOf "$RUNNER_TEMP/effect/envs-effect.tar" ENTRY)"
          [[ "$entry" =~ ^/nix/store/[0-9a-z]{32}-envs-effect-toolchain/bin/envs-effect$ ]]
          sudo mkdir -p /nix/store
          sudo tar -x -C / -f "$RUNNER_TEMP/effect/envs-effect.tar" nix/store
          tool="${entry%/envs-effect}"
          receiver="$(cat "$RUNNER_TEMP/placement/rent-receive.sh")"
          values="$RUNNER_TEMP/placement-inputs/values.json"
          docker volume create rent-placement-state >/dev/null
          place() {
            SOPS_AGE_KEY_FILE="$RUNNER_TEMP/placement-identities/rent.key" "$tool/sops" --decrypt --input-type yaml \
              --extract '["RENT_TUNNEL_TOKEN"]' "$RUNNER_TEMP/placement-inputs/rent.sops.yaml" | tr -d '\r\n' |
              docker run --rm -i -v rent-placement-state:/var/lib/rent "$RENT_IMAGE" /bin/bash -c "$receiver"
          }
          slot() { docker run --rm -v rent-placement-state:/s "$RENT_IMAGE" /bin/bash -c "$1"; }
          receive() { docker run --rm -i -v rent-placement-state:/var/lib/rent "$RENT_IMAGE" /bin/bash -c "$receiver"; }
          token_sha() { slot 'sha256sum /s/cloudflared/token' | cut -d ' ' -f 1; }
          test "$(place)" = "rent-receive: placed"
          test "$(slot 'stat -c %u:%g:%a /s/cloudflared/token')" = "0:0:600"
          test "$(token_sha)" = "$(jq -r .tunnel_sha256 "$values")"
          # Exclusion over the placed token: a holder in the same image takes the state-root lock the receiver takes.
          # While it holds it, the real receiver refuses another token with exit 2 and the exact busy line and the whole
          # volume, slot included, stays identical; after that holder is removed and gone, the same receiver places that
          # token, and the original token is placed again for the checks below. Only the container this step created
          # (by its ID) is ever removed.
          holder=""
          trap 'if [ -n "$holder" ]; then docker rm -f "$holder" >/dev/null 2>&1 || true; fi' EXIT
          created="$(docker run -d -v rent-placement-state:/var/lib/rent "$RENT_IMAGE" \
            /bin/bash -c 'exec 9</var/lib/rent || exit 3; /bin/flock -x -n 9 || exit 4; echo held; exec sleep 600')"
          [[ "$created" =~ ^[0-9a-f]{64}$ ]]
          holder="$created"
          held() { [ "$(docker logs "$holder" 2>&1)" = held ] && [ "$(docker inspect -f '{{.State.Running}}' "$holder")" = true ]; }
          for _ in $(seq 30); do
            if held; then break; fi
            sleep 1
          done
          if ! held; then
            echo "the lock holder is not holding: exit $(docker inspect -f '{{.State.ExitCode}}' "$holder")" >&2
            exit 1
          fi
          volume_state() { slot 'set -euo pipefail; cd /s; find . -printf "%y %U:%G %m %s %p\n" | LC_ALL=C sort; find . -type f -exec sha256sum {} + | LC_ALL=C sort'; }
          before="$(volume_state)"
          busy="$(head -c 48 /dev/urandom | base64 -w0)"
          busy_sha="$(printf '%s' "$busy" | sha256sum | cut -d ' ' -f 1)"
          test "$busy_sha" != "$(token_sha)"
          set +e
          printf '%s' "$busy" | receive >"$RUNNER_TEMP/busy.out" 2>"$RUNNER_TEMP/busy.err"
          codes=("${PIPESTATUS[@]}")
          set -e
          test "${codes[1]}" = 2
          case "${codes[0]}" in 0 | 141) ;; *) echo "the busy producer failed: ${codes[0]}" >&2; exit 1 ;; esac
          test ! -s "$RUNNER_TEMP/busy.out"
          test "$(cat "$RUNNER_TEMP/busy.err")" = "rent-receive: the state volume is in use by a running rent or another writer"
          after="$(volume_state)"
          test "$after" = "$before"
          if ! held; then
            echo "the lock holder stopped during the busy attempt" >&2
            exit 1
          fi
          docker rm -f "$holder" >/dev/null
          if docker inspect "$holder" >/dev/null 2>&1; then
            echo "the lock holder was not removed" >&2
            exit 1
          fi
          holder=""
          test "$(printf '%s' "$busy" | receive)" = "rent-receive: placed"
          test "$(slot 'stat -c %u:%g:%a /s/cloudflared/token')" = "0:0:600"
          test "$(token_sha)" = "$busy_sha"
          test "$(place)" = "rent-receive: placed"
          test "$(token_sha)" = "$(jq -r .tunnel_sha256 "$values")"
          test "$(place)" = "rent-receive: unchanged"
          for bad in '' '   ' "$(head -c 4097 /dev/zero | tr '\0' a)"; do
            if printf '%s' "$bad" | receive; then
              echo "an invalid token was placed" >&2
              exit 1
            fi
          done
          test "$(token_sha)" = "$(jq -r .tunnel_sha256 "$values")"
          # Rotation replaces only the owned slot; a slot of another owner or mode is refused and kept as found.
          other="$(head -c 96 /dev/urandom | base64 -w0)"
          test "$(printf '%s' "$other" | receive)" = "rent-receive: placed"
          test "$(token_sha)" = "$(printf '%s' "$other" | sha256sum | cut -d ' ' -f 1)"
          for drift in 'chmod 644 /s/cloudflared/token' 'chown 1000:1000 /s/cloudflared/token'; do
            slot "$drift"
            before="$(slot 'stat -c %u:%g:%a /s/cloudflared/token')"
            if place; then
              echo "a drifted slot was replaced: $drift" >&2
              exit 1
            fi
            test "$(slot 'stat -c %u:%g:%a /s/cloudflared/token')" = "$before"
            test "$(token_sha)" = "$(printf '%s' "$other" | sha256sum | cut -d ' ' -f 1)"
            slot 'chown 0:0 /s/cloudflared/token && chmod 600 /s/cloudflared/token'
          done
          # A parent another user could change, at either level, is refused before input: the slot keeps its bytes,
          # owner and mode and no temp file appears. A safe parent of another mode (755) is still accepted.
          root_mode="$(slot 'stat -c %a /s')"
          for pair in 'chmod 777 /s/cloudflared|chmod 700 /s/cloudflared' 'chmod 770 /s/cloudflared|chmod 700 /s/cloudflared' \
            'chown 1000:0 /s/cloudflared|chown 0:0 /s/cloudflared' "chmod 775 /s|chmod $root_mode /s" 'chown 1000:0 /s|chown 0:0 /s'; do
            before="$(slot 'stat -c %u:%g:%a:%s /s/cloudflared/token')"
            slot "${pair%%|*}"
            if place; then
              echo "an unsafe parent was accepted: ${pair%%|*}" >&2
              exit 1
            fi
            slot "${pair#*|}"
            test "$(slot 'stat -c %u:%g:%a:%s /s/cloudflared/token')" = "$before"
            test "$(token_sha)" = "$(printf '%s' "$other" | sha256sum | cut -d ' ' -f 1)"
            test -z "$(slot 'ls -A /s/cloudflared | grep -v ^token$ || true')"
          done
          slot 'chmod 755 /s/cloudflared'
          test "$(printf '%s' "$other" | receive)" = "rent-receive: unchanged"
          test -z "$(slot 'ls -A /s/cloudflared | grep -v ^token$ || true')"
          echo "rent-receive.sh in $RENT_IMAGE: placed 0:0 600 exact token; refused another token with the exact busy line and left the whole volume, slot included, identical while a holder held the state-root lock, then after its removal placed that token and the original again; same value unchanged, rotated; blank, whitespace, oversized and drifted (mode, owner) slots and writable or foreign parents (slot directory and state root) refused and kept; a 755 parent accepted"

  toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ENVS_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      # The artifact is built from, and named after, this exact commit (never a PR merge ref).
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Built source is the named commit
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ENVS_SOURCE_SHA"
          test -z "$(git status --porcelain)"
          echo "source commit=$ENVS_SOURCE_SHA tree=$(git rev-parse 'HEAD^{tree}')"

      - name: Install pinned Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes

      - name: Reconstruct repo-owned effect toolchain
        run: nix build .#effect-toolchain --no-update-lock-file --print-build-logs --out-link "$RUNNER_TEMP/envs-effect"

      - name: Nix regenerates the committed lock from flake.nix
        run: |
          set -euo pipefail
          relock="$RUNNER_TEMP/relock"
          mkdir "$relock"
          git archive HEAD -- . ':!flake.lock' | tar -x -C "$relock"
          nix flake lock "$relock"
          cmp flake.lock "$relock/flake.lock"

      - name: Execute exact effect entry
        run: '"$RUNNER_TEMP/envs-effect/bin/envs-effect" toolchain'

      - name: Execute closure tools without credentials
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/envs-effect/bin"
          "$tool/python3" --version
          "$tool/sops" --version
          "$tool/git" --version
          "$tool/gh" --version
          "$tool/wrangler" --version
          for command in put list; do
            help="$("$tool/wrangler" pages secret "$command" --help 2>&1)"
            printf '%s\n' "$help"
            grep -F -- '--project-name' <<<"$help" >/dev/null
          done
          "$tool/wrangler" pages secret put --help 2>&1 | grep -Ei 'pages secret put <key>' >/dev/null

      # The probe tools come from the built closure: the exact client version and its service-token flags, the provider
      # declaration and the persistent root initialized and validated with every network route closed, and a real
      # localhost sshd/ssh exchange.
      - name: Access probe tools from the closure without network or credentials
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/envs-effect/bin"
          "$tool/cloudflared" --version | tee "$RUNNER_TEMP/cloudflared.version"
          grep -qF "cloudflared version 2026.6.1 " "$RUNNER_TEMP/cloudflared.version"
          "$tool/cloudflared" access ssh --help >"$RUNNER_TEMP/access-ssh.help" 2>&1 || true
          grep -qF -- --service-token-id "$RUNNER_TEMP/access-ssh.help"
          grep -qF -- --service-token-secret "$RUNNER_TEMP/access-ssh.help"
          probe="$RUNNER_TEMP/probe-config"
          mkdir "$probe"
          cp providers/dev-rent-access-probe/main.tf "$probe/"
          HTTPS_PROXY=http://127.0.0.1:9 HTTP_PROXY=http://127.0.0.1:9 "$tool/tofu" -chdir="$probe" init -input=false -no-color
          "$tool/tofu" -chdir="$probe" validate -no-color
          # The persistent root is declaration only: initialized without its backend and validated, never planned.
          rent="$RUNNER_TEMP/rent-cloudflare"
          mkdir "$rent"
          cp providers/dev-rent-cloudflare/main.tf "$rent/"
          HTTPS_PROXY=http://127.0.0.1:9 HTTP_PROXY=http://127.0.0.1:9 "$tool/tofu" -chdir="$rent" init -backend=false -input=false -no-color
          "$tool/tofu" -chdir="$rent" validate -no-color
          "$tool/ssh" -V
          "$tool/python3" -I checks/test_rent_access_probe.py --real-ssh "$tool"

      # The state proof roots come from the same closure: both initialized and validated with every network route
      # closed (the backend root without a backend), the Wrangler raw-read and marker-write argv shapes, and the
      # self-test with real OpenTofu and the real closure curl against a loopback HTTP fixture.
      - name: State proof roots from the closure without network or credentials
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/envs-effect/bin"
          state="$RUNNER_TEMP/state-config"
          mkdir -p "$state/backend"
          cp providers/dev-rent-state-proof/main.tf "$state/"
          cp providers/dev-rent-state-proof/backend/main.tf "$state/backend/"
          HTTPS_PROXY=http://127.0.0.1:9 HTTP_PROXY=http://127.0.0.1:9 "$tool/tofu" -chdir="$state" init -input=false -no-color
          "$tool/tofu" -chdir="$state" validate -no-color
          HTTPS_PROXY=http://127.0.0.1:9 HTTP_PROXY=http://127.0.0.1:9 "$tool/tofu" -chdir="$state/backend" init -backend=false -input=false -no-color
          "$tool/tofu" -chdir="$state/backend" validate -no-color
          "$tool/tofu" version
          "$tool/wrangler" r2 object get --help >"$RUNNER_TEMP/r2-object-get.help" 2>&1 || true
          grep -qF -- --pipe "$RUNNER_TEMP/r2-object-get.help"
          grep -qF -- --remote "$RUNNER_TEMP/r2-object-get.help"
          "$tool/wrangler" r2 object put --help >"$RUNNER_TEMP/r2-object-put.help" 2>&1 || true
          grep -qF -- --pipe "$RUNNER_TEMP/r2-object-put.help"
          "$tool/curl" --version
          "$tool/python3" -I checks/test_rent_state_proof.py --real-tofu "$tool/tofu" --real-s3 "$tool/curl"

      - name: Test Jev adapter on the toolchain interpreter
        run: '"$RUNNER_TEMP/envs-effect/bin/python3" -I checks/test_jev_api.py'

      - name: Test Linode read probe on the toolchain interpreter
        run: '"$RUNNER_TEMP/envs-effect/bin/python3" -I checks/test_linode_read_probe.py'

      # The locked closure sops encrypts and decrypts for real; check-only age makes throwaway identities in a temp dir.
      # The closure tofu applies an encrypted schema-only fixture root whose real output reaches the production sealer.
      - name: Real locked SOPS roundtrip for the rent tunnel token
        run: |
          set -euo pipefail
          nix build .#check-age --no-update-lock-file --out-link "$RUNNER_TEMP/check-age"
          tool="$RUNNER_TEMP/envs-effect/bin"
          "$tool/python3" -I checks/test_rent_tunnel.py --sops "$tool/sops" --age-keygen "$RUNNER_TEMP/check-age/bin/age-keygen" --tofu "$tool/tofu"

      # The same locked sops and check-only age prove the OCI dev target's single-recipient Jev ciphertext.
      - name: Real locked SOPS roundtrip for the OCI dev Jev key
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/envs-effect/bin"
          "$tool/python3" -I checks/test_jev_api.py --sops "$tool/sops" --age-keygen "$RUNNER_TEMP/check-age/bin/age-keygen"

      # Throwaway identities for the placement gate only, made by the check-only age; the gate's envelopes are
      # encrypted to them. They never enter the effect toolchain or the placement distribution.
      - name: Synthetic placement identities from the check-only age
        run: |
          set -euo pipefail
          keys="$RUNNER_TEMP/placement-identities"
          mkdir "$keys"
          for name in client rent; do
            "$RUNNER_TEMP/check-age/bin/age-keygen" -o "$keys/$name.key" 2>/dev/null
            "$RUNNER_TEMP/check-age/bin/age-keygen" -y "$keys/$name.key" >"$keys/$name.pub"
          done

      - name: Provide the synthetic placement identities
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: placement-identities-${{ env.ENVS_SOURCE_SHA }}
          path: ${{ runner.temp }}/placement-identities/
          if-no-files-found: error
          retention-days: 1

      - name: Missing or mismatched toolchain is RED
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/envs-effect/bin"
          if "$tool/python3" -I adapters/jev_api.py toolchain; then
            echo "ambient entry without the toolchain manifest was accepted" >&2
            exit 1
          fi
          copy="$RUNNER_TEMP/mismatched-lock"
          mkdir "$copy"
          "$tool/git" archive HEAD | tar -x -C "$copy"
          "$tool/python3" -I -c 'import json, sys; p = sys.argv[1]; v = json.load(open(p)); v["nodes"]["nixpkgs"]["locked"]["narHash"] = "sha256-" + "A" * 43 + "="; json.dump(v, open(p, "w"))' "$copy/flake.lock"
          if "$tool/envs-effect" --root "$copy" toolchain; then
            echo "toolchain differing from flake.lock was accepted" >&2
            exit 1
          fi

      - name: Build provided effect artifact
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/provide"
          nix build .#effect-artifact --no-update-lock-file --print-build-logs --out-link "$RUNNER_TEMP/provide/envs-effect.tar"
          test "$(tar -xOf "$RUNNER_TEMP/provide/envs-effect.tar" SOURCE)" = "$ENVS_SOURCE_SHA"
          sha256sum "$RUNNER_TEMP/provide/envs-effect.tar"

      # Positive control: the listing does contain the closure sops, so an age binary there would be found too.
      - name: Check-only age is outside the provided artifact
        run: |
          set -euo pipefail
          tar -tf "$RUNNER_TEMP/provide/envs-effect.tar" >"$RUNNER_TEMP/provided.list"
          sops="$(readlink -f "$RUNNER_TEMP/envs-effect/bin/sops")"
          sops="${sops#/}"
          age="$(readlink -f "$RUNNER_TEMP/check-age/bin/age-keygen")"
          age="${age#/}"
          grep -qxF "$sops" "$RUNNER_TEMP/provided.list"
          curl="$(readlink -f "$RUNNER_TEMP/envs-effect/bin/curl")"
          curl="${curl#/}"
          grep -qxF "$curl" "$RUNNER_TEMP/provided.list"
          if grep -qxF "$age" "$RUNNER_TEMP/provided.list"; then
            echo "check-only age is in the provided artifact" >&2
            exit 1
          fi
          echo "provided artifact: sops and curl present, age absent; $(stat -L -c %s "$RUNNER_TEMP/provide/envs-effect.tar") bytes"

      - name: Provide effect artifact
        id: provide
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: envs-effect-${{ env.ENVS_SOURCE_SHA }}
          path: ${{ runner.temp }}/provide/envs-effect.tar
          if-no-files-found: error
          compression-level: 1

      - name: Record provided artifact identity
        env:
          ARTIFACT_ID: ${{ steps.provide.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.provide.outputs.artifact-digest }}
          ARTIFACT_URL: ${{ steps.provide.outputs.artifact-url }}
        run: echo "provided artifact id=$ARTIFACT_ID digest=$ARTIFACT_DIGEST url=$ARTIFACT_URL"

  # Effect shape: provided artifact over a data checkout of the same commit, run as author/project run it before secrets.
  effect-shape:
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source commit as data root
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Obtain provided effect artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ENVS_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          echo "platform: $ImageOS $ImageVersion"
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions"
          auth="Authorization: Bearer $GH_TOKEN"
          art="$(mktemp -d)"
          curl -fsSL -H "$auth" -o "$art/list.json" "$api/artifacts?name=envs-effect-$ENVS_SOURCE_SHA&per_page=100"
          jq -e '[.artifacts[] | select(.expired | not)] | length == 1 and (.[0].digest | test("^sha256:[0-9a-f]{64}$"))' "$art/list.json" >/dev/null
          jq '[.artifacts[] | select(.expired | not)][0]' "$art/list.json" >"$art/artifact.json"
          id="$(jq -r '.id' "$art/artifact.json")"
          digest="$(jq -r '.digest' "$art/artifact.json")"
          run_id="$(jq -r '.workflow_run.id' "$art/artifact.json")"
          curl -fsSL -H "$auth" -o "$art/run.json" "$api/runs/$run_id"
          jq -e --arg sha "$ENVS_SOURCE_SHA" --arg branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" --arg repo "$GITHUB_REPOSITORY" --arg current "$GITHUB_RUN_ID" \
            '.path == ".github/workflows/check.yml" and .head_sha == $sha and .head_branch == $branch and .repository.full_name == $repo and .head_repository.full_name == $repo and ((.id | tostring) == $current or (.event == "push" and .conclusion == "success"))' \
            "$art/run.json" >/dev/null
          curl -fsSL -H "$auth" -o "$art/envs-effect.zip" "$api/artifacts/$id/zip"
          echo "${digest#sha256:}  $art/envs-effect.zip" | sha256sum -c -
          unzip -q "$art/envs-effect.zip" -d "$art/content"
          test "$(ls -A "$art/content")" = envs-effect.tar
          test "$(tar -xOf "$art/content/envs-effect.tar" SOURCE)" = "$ENVS_SOURCE_SHA"
          entry="$(tar -xOf "$art/content/envs-effect.tar" ENTRY)"
          [[ "$entry" =~ ^/nix/store/[0-9a-z]{32}-envs-effect-toolchain/bin/envs-effect$ ]]
          sudo mkdir -p /nix/store
          sudo tar -x -C / -f "$art/content/envs-effect.tar" nix/store
          test -x "$entry"
          echo "artifact: run=$run_id id=$id digest=$digest entry=$entry"
          echo "ENVS_EFFECT_BIN=${entry%/envs-effect}" >>"$GITHUB_ENV"
          echo "ENVS_EFFECT_DIGEST=$digest" >>"$GITHUB_ENV"
          echo "ENVS_EFFECT_ZIP=$art/envs-effect.zip" >>"$GITHUB_ENV"

      - name: Provided artifact runs in the effect data-root shape
        env:
          ENVS_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if command -v nix; then
            echo "Nix is present on the effect-shape runner" >&2
            exit 1
          fi
          test "$("$ENVS_EFFECT_BIN/git" -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$ENVS_SOURCE_SHA"
          "$ENVS_EFFECT_BIN/envs-effect" --root "$GITHUB_WORKSPACE" toolchain | tee "$RUNNER_TEMP/identity.json"
          jq -e --arg sha "$ENVS_SOURCE_SHA" --arg root "$GITHUB_WORKSPACE" '.status == "PASS" and .source == $sha and .root == $root' "$RUNNER_TEMP/identity.json" >/dev/null
          "$ENVS_EFFECT_BIN/envs-effect" --root "$GITHUB_WORKSPACE" check
          "$ENVS_EFFECT_BIN/envs-effect" --root "$GITHUB_WORKSPACE" readiness
          "$ENVS_EFFECT_BIN/python3" -I checks/repository.py

  # Fresh consumer: no checkout, no Nix; obtains the provided artifact exactly as the effect workflows do.
  clean-start:
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Obtain provided effect artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ENVS_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          echo "platform: $ImageOS $ImageVersion"
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions"
          auth="Authorization: Bearer $GH_TOKEN"
          art="$(mktemp -d)"
          curl -fsSL -H "$auth" -o "$art/list.json" "$api/artifacts?name=envs-effect-$ENVS_SOURCE_SHA&per_page=100"
          jq -e '[.artifacts[] | select(.expired | not)] | length == 1 and (.[0].digest | test("^sha256:[0-9a-f]{64}$"))' "$art/list.json" >/dev/null
          jq '[.artifacts[] | select(.expired | not)][0]' "$art/list.json" >"$art/artifact.json"
          id="$(jq -r '.id' "$art/artifact.json")"
          digest="$(jq -r '.digest' "$art/artifact.json")"
          run_id="$(jq -r '.workflow_run.id' "$art/artifact.json")"
          curl -fsSL -H "$auth" -o "$art/run.json" "$api/runs/$run_id"
          jq -e --arg sha "$ENVS_SOURCE_SHA" --arg branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" --arg repo "$GITHUB_REPOSITORY" --arg current "$GITHUB_RUN_ID" \
            '.path == ".github/workflows/check.yml" and .head_sha == $sha and .head_branch == $branch and .repository.full_name == $repo and .head_repository.full_name == $repo and ((.id | tostring) == $current or (.event == "push" and .conclusion == "success"))' \
            "$art/run.json" >/dev/null
          curl -fsSL -H "$auth" -o "$art/envs-effect.zip" "$api/artifacts/$id/zip"
          echo "${digest#sha256:}  $art/envs-effect.zip" | sha256sum -c -
          unzip -q "$art/envs-effect.zip" -d "$art/content"
          test "$(ls -A "$art/content")" = envs-effect.tar
          test "$(tar -xOf "$art/content/envs-effect.tar" SOURCE)" = "$ENVS_SOURCE_SHA"
          entry="$(tar -xOf "$art/content/envs-effect.tar" ENTRY)"
          [[ "$entry" =~ ^/nix/store/[0-9a-z]{32}-envs-effect-toolchain/bin/envs-effect$ ]]
          sudo mkdir -p /nix/store
          sudo tar -x -C / -f "$art/content/envs-effect.tar" nix/store
          test -x "$entry"
          echo "artifact: run=$run_id id=$id digest=$digest entry=$entry"
          echo "ENVS_EFFECT_BIN=${entry%/envs-effect}" >>"$GITHUB_ENV"
          echo "ENVS_EFFECT_DIGEST=$digest" >>"$GITHUB_ENV"
          echo "ENVS_EFFECT_ZIP=$art/envs-effect.zip" >>"$GITHUB_ENV"

      - name: Clean start has no source checkout or Nix
        run: |
          set -euo pipefail
          test -z "$(ls -A "$GITHUB_WORKSPACE")"
          if command -v nix; then
            echo "Nix is present on the clean-start runner" >&2
            exit 1
          fi

      - name: Run provided entry and tools without credentials
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -euo pipefail
          "$ENVS_EFFECT_BIN/envs-effect" toolchain
          "$ENVS_EFFECT_BIN/envs-effect" check
          for tool in python3 sops git gh wrangler; do
            "$ENVS_EFFECT_BIN/$tool" --version
          done

      - name: Missing artifact is RED
        id: missing
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ENVS_SOURCE_SHA: "0000000000000000000000000000000000000000"
        run: |
          set -euo pipefail
          echo "platform: $ImageOS $ImageVersion"
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions"
          auth="Authorization: Bearer $GH_TOKEN"
          art="$(mktemp -d)"
          curl -fsSL -H "$auth" -o "$art/list.json" "$api/artifacts?name=envs-effect-$ENVS_SOURCE_SHA&per_page=100"
          jq -e '[.artifacts[] | select(.expired | not)] | length == 1 and (.[0].digest | test("^sha256:[0-9a-f]{64}$"))' "$art/list.json" >/dev/null
          jq '[.artifacts[] | select(.expired | not)][0]' "$art/list.json" >"$art/artifact.json"
          id="$(jq -r '.id' "$art/artifact.json")"
          digest="$(jq -r '.digest' "$art/artifact.json")"
          run_id="$(jq -r '.workflow_run.id' "$art/artifact.json")"
          curl -fsSL -H "$auth" -o "$art/run.json" "$api/runs/$run_id"
          jq -e --arg sha "$ENVS_SOURCE_SHA" --arg branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" --arg repo "$GITHUB_REPOSITORY" --arg current "$GITHUB_RUN_ID" \
            '.path == ".github/workflows/check.yml" and .head_sha == $sha and .head_branch == $branch and .repository.full_name == $repo and .head_repository.full_name == $repo and ((.id | tostring) == $current or (.event == "push" and .conclusion == "success"))' \
            "$art/run.json" >/dev/null
          curl -fsSL -H "$auth" -o "$art/envs-effect.zip" "$api/artifacts/$id/zip"
          echo "${digest#sha256:}  $art/envs-effect.zip" | sha256sum -c -
          unzip -q "$art/envs-effect.zip" -d "$art/content"
          test "$(ls -A "$art/content")" = envs-effect.tar
          test "$(tar -xOf "$art/content/envs-effect.tar" SOURCE)" = "$ENVS_SOURCE_SHA"
          entry="$(tar -xOf "$art/content/envs-effect.tar" ENTRY)"
          [[ "$entry" =~ ^/nix/store/[0-9a-z]{32}-envs-effect-toolchain/bin/envs-effect$ ]]
          sudo mkdir -p /nix/store
          sudo tar -x -C / -f "$art/content/envs-effect.tar" nix/store
          test -x "$entry"
          echo "artifact: run=$run_id id=$id digest=$digest entry=$entry"
          echo "ENVS_EFFECT_BIN=${entry%/envs-effect}" >>"$GITHUB_ENV"
          echo "ENVS_EFFECT_DIGEST=$digest" >>"$GITHUB_ENV"
          echo "ENVS_EFFECT_ZIP=$art/envs-effect.zip" >>"$GITHUB_ENV"

      - name: Missing, altered, or mismatched artifact is RED before tools run
        env:
          MISSING: ${{ steps.missing.outcome }}
        run: |
          set -euo pipefail
          test "$MISSING" = failure
          altered="$RUNNER_TEMP/altered.zip"
          cp "$ENVS_EFFECT_ZIP" "$altered"
          printf 'x' | dd of="$altered" bs=1 seek=4096 conv=notrunc status=none
          if echo "${ENVS_EFFECT_DIGEST#sha256:}  $altered" | sha256sum -c -; then
            echo "altered artifact was accepted" >&2
            exit 1
          fi
          source="$("$ENVS_EFFECT_BIN/envs-effect" toolchain | jq -r .root)"
          for case in lock adapter; do
            copy="$RUNNER_TEMP/mismatched-$case"
            cp -R "$source" "$copy"
            chmod -R u+w "$copy"
            if [ "$case" = lock ]; then
              jq '.nodes.nixpkgs.locked.narHash = "sha256-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="' "$source/flake.lock" >"$copy/flake.lock"
            else
              echo "# altered" >>"$copy/adapters/jev_api.py"
            fi
            if "$ENVS_EFFECT_BIN/envs-effect" --root "$copy" toolchain; then
              echo "mismatched $case was accepted" >&2
              exit 1
            fi
          done

      - name: Commit, event, or repository mismatch is RED before extraction
        env:
          GH_TOKEN: ${{ github.token }}
          ENVS_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions"
          auth="Authorization: Bearer $GH_TOKEN"
          art="$(mktemp -d)"
          curl -fsSL -H "$auth" -o "$art/producer.json" "$api/runs/$GITHUB_RUN_ID"
          for change in . \
            '.head_sha = "0000000000000000000000000000000000000000"' \
            '.id = 1 | .event = "pull_request"' \
            '.id = 1 | .event = "workflow_dispatch" | .conclusion = "success"' \
            '.repository.full_name = "fork/envs"' \
            '.head_repository.full_name = "fork/envs"' \
            '.path = ".github/workflows/other.yml"'; do
            jq "$change" "$art/producer.json" >"$art/run.json"
            if jq -e --arg sha "$ENVS_SOURCE_SHA" --arg branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" --arg repo "$GITHUB_REPOSITORY" --arg current "$GITHUB_RUN_ID" \
              '.path == ".github/workflows/check.yml" and .head_sha == $sha and .head_branch == $branch and .repository.full_name == $repo and .head_repository.full_name == $repo and ((.id | tostring) == $current or (.event == "push" and .conclusion == "success"))' \
              "$art/run.json" >/dev/null; then
              accepted=yes
            else
              accepted=no
            fi
            expected=no
            if [ "$change" = . ]; then
              expected=yes
            fi
            echo "producer $change: accepted=$accepted"
            test "$accepted" = "$expected"
          done
          mkdir "$art/content"
          echo 0000000000000000000000000000000000000000 >"$art/SOURCE"
          echo "$ENVS_EFFECT_BIN/envs-effect" >"$art/ENTRY"
          tar -cf "$art/content/envs-effect.tar" -C "$art" ENTRY SOURCE
          if test "$(tar -xOf "$art/content/envs-effect.tar" SOURCE)" = "$ENVS_SOURCE_SHA"; then
            echo "artifact built from another commit was accepted" >&2
            exit 1
          fi
          echo "artifact built from another commit: RED"
