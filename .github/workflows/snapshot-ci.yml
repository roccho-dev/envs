name: snapshot-ci

on:
  push:
    branches: [main, proposals]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snapshot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safety-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact snapshot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Verify public snapshot safety and contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path('.')
          forbidden_names = {'.env', 'id_rsa', 'id_ed25519'}
          forbidden_suffixes = {'.pem', '.p12', '.pfx'}
          forbidden_patterns = {
              'age private identity': re.compile(rb'AGE-SECRET-KEY-1[0-9A-Z]{20,}'),
              'private key header': re.compile(rb'-----BEGIN (?:OPENSSH |RSA |EC |DSA )?PRIVATE KEY-----'),
              'GitHub token': re.compile(rb'\b(?:gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,})\b'),
              'AWS access key': re.compile(rb'\b(?:AKIA|ASIA)[0-9A-Z]{16}\b'),
              'npm token': re.compile(rb'\bnpm_[A-Za-z0-9]{30,}\b'),
              'Google API key': re.compile(rb'\bAIza[0-9A-Za-z_-]{30,}\b'),
              'Slack token': re.compile(rb'\bxox[baprs]-[0-9A-Za-z-]{20,}\b'),
              'Stripe live key': re.compile(rb'\bsk_live_[0-9A-Za-z]{20,}\b'),
              'basic-auth URL': re.compile(rb'https?://[^\s/:@]+:[^\s/@]+@[^\s]+'),
          }

          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              if path.name in forbidden_names or path.suffix.lower() in forbidden_suffixes:
                  raise SystemExit(f'forbidden private-material filename: {path}')
              data = path.read_bytes()
              for label, pattern in forbidden_patterns.items():
                  if pattern.search(data):
                      raise SystemExit(f'{label} found in {path}')
              if path.suffix == '.jsonl':
                  for number, line in enumerate(data.decode().splitlines(), 1):
                      if line.strip():
                          value = json.loads(line)
                          if not isinstance(value, dict):
                              raise SystemExit(f'{path}:{number}: JSONL row is not an object')

          planes = {}
          for line in Path('environments/secret-planes.jsonl').read_text().splitlines():
              if line.strip():
                  row = json.loads(line)
                  planes[row['id']] = row

          expected_ids = {
              'dev.authoring', 'dev.projection', 'dev.runtime',
              'stg.projection', 'stg.runtime',
              'prd.projection', 'prd.runtime',
          }
          if set(planes) != expected_ids:
              raise SystemExit('secret-plane set differs')
          if any('std' in value for value in planes):
              raise SystemExit('std is forbidden; use stg')

          for plane_id in ('dev.runtime', 'stg.runtime', 'prd.runtime'):
              if planes[plane_id]['owner'] != 'target':
                  raise SystemExit(f'{plane_id}: runtime must be target-owned')

          for plane_id in ('stg.projection', 'prd.projection'):
              row = planes[plane_id]
              if row['owner'] != 'envs' or row['migration_state'] != 'NOT_CONFIGURED':
                  raise SystemExit(f'{plane_id}: must remain envs-owned and NOT_CONFIGURED')
              if row['active_github_environment'] is not None:
                  raise SystemExit(f'{plane_id}: active Environment must be absent')

          cipher = Path('secrets/jev-api-key.sops.yaml')
          configured = cipher.is_file()
          expected_dev = {
              'dev.authoring': 'dev-authoring',
              'dev.projection': 'dev-projection',
          }
          for plane_id, environment in expected_dev.items():
              row = planes[plane_id]
              if row['owner'] != 'envs' or row['github_environment'] != environment:
                  raise SystemExit(f'{plane_id}: desired Environment contract mismatch')
              if configured:
                  if row['active_github_environment'] != environment or row['migration_state'] != 'ACTIVE':
                      raise SystemExit(f'{plane_id}: configured ciphertext requires ACTIVE state')
              else:
                  if row['active_github_environment'] is not None or row['migration_state'] != 'NOT_CONFIGURED':
                      raise SystemExit(f'{plane_id}: pre-authoring state must be NOT_CONFIGURED')

          secrets_dir = Path('secrets')
          if configured:
              actual = sorted(str(path) for path in secrets_dir.rglob('*') if path.is_file())
              if actual != ['secrets/jev-api-key.sops.yaml']:
                  raise SystemExit(f'unexpected secret files: {actual}')
              body = cipher.read_text(encoding='utf-8')
              if 'JEV_API_KEY: ENC[AES256_GCM,' not in body or '\nsops:' not in body:
                  raise SystemExit('invalid SOPS ciphertext')
              recipients = re.findall(r'(?m)^\s*recipient:\s*(age1[0-9a-z]+)\s*$', body)
              if not recipients or len(recipients) != len(set(recipients)):
                  raise SystemExit('unique public age recipient is required')
          elif secrets_dir.exists() and any(secrets_dir.iterdir()):
              raise SystemExit('secrets/ must be empty before new-key authoring')

          workflows = {
              'authoring': Path('.github/workflows/secret-materialize.yml').read_text(),
              'projection': Path('.github/workflows/runtime-secret-projection.yml').read_text(),
          }
          for name, text in workflows.items():
              for forbidden in ('pull_request_target:', 'secrets: inherit', 'environment: ${{'):
                  if forbidden in text:
                      raise SystemExit(f'{name}: forbidden workflow marker {forbidden}')
              for action, ref in re.findall(r'(?m)^\s*(?:-\s*)?uses:\s*([^@\s]+)@([^\s#]+)', text):
                  if not action.startswith(('./', 'docker://')) and not re.fullmatch(r'[0-9a-f]{40}', ref):
                      raise SystemExit(f'{name}: mutable Action {action}@{ref}')

          authoring = workflows['authoring']
          for marker in (
              "github.repository == 'roccho-dev/envs'",
              "github.ref_name == 'proposals'",
              'environment: dev-authoring',
              'environment: dev-projection',
              'github.event_name == \'workflow_dispatch\'',
          ):
              if marker not in authoring:
                  raise SystemExit(f'authoring workflow missing {marker}')

          projection = workflows['projection']
          for marker in (
              'workflow_dispatch:',
              "github.repository == 'roccho-dev/envs'",
              "github.ref_name == 'proposals'",
              'environment: dev-projection',
          ):
              if marker not in projection:
                  raise SystemExit(f'projection workflow missing {marker}')
          if '\n  push:' in projection or '\n  pull_request:' in projection:
              raise SystemExit('projection effect must be manual-only')

          print('SNAPSHOT_SAFETY=PASS')
          print('SECRET_PLANES=PASS')
          print('SOPS_STATE=' + ('ACTIVE' if configured else 'NOT_CONFIGURED'))
          PY

      - name: Verify consumer and projection contracts
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/runtime-secret-projection.sh check
          bash tests/runtime-secret-projection-destructive.sh

  go-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify dependencies
        run: go mod verify
      - name: Test imported implementation
        run: go test ./... -count=1
      - name: Vet imported implementation
        run: go vet ./...
      - name: Build imported commands
        run: go build ./...
      - name: Prove deterministic appearance projection
        shell: bash
        run: |
          set -euo pipefail
          first="$RUNNER_TEMP/appearance-first"
          second="$RUNNER_TEMP/appearance-second"
          go run ./cmd/envctl-appearance -input appearance/desired.jsonl -output "$first"
          go run ./cmd/envctl-appearance -input appearance/desired.jsonl -output "$second"
          diff -ru "$first" "$second"

  nix-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes
      - name: Parse Nix sources
        run: |
          set -euo pipefail
          nix-instantiate --parse flake.nix >/dev/null
          nix-instantiate --parse bindings/duckdb/flake.nix >/dev/null
          nix-instantiate --parse lib/package-bindings.nix >/dev/null
          nix-instantiate --parse modules/ssot-github-refs.nix >/dev/null
      - name: Evaluate root flake contracts
        run: nix flake check -L --show-trace --no-write-lock-file
